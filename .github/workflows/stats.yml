name: Mise à jour des stats TRMNL

on:
  # Déclenché chaque heure par cron-job.org (via l'API GitHub),
  # ou à la main avec le bouton « Run workflow ».
  workflow_dispatch:
    inputs:
      collect:
        description: 'Relever les recettes sur TRMNL (décocher pour republier seulement le site, par exemple après un changement de nom)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: trmnl-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer l'historique déjà publié
        run: |
          mkdir -p public/data
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            for f in hourly.json daily.json latest.json trmnl.json; do
              git show "origin/gh-pages:data/$f" > "public/data/$f" 2>/dev/null || rm -f "public/data/$f"
            done
          else
            echo "Premier lancement : pas encore d'historique."
          fi

      - name: Collecter les recettes et calculer les classements
        env:
          COLLECT: ${{ inputs.collect }}
        run: |
          if [ "$COLLECT" = "false" ] && [ -f public/data/latest.json ]; then
            echo "Republication seule : aucun appel à l'API TRMNL, données précédentes conservées."
          else
            node scripts/fetch-stats.mjs public/data
            node scripts/fetch-trmnl.mjs public/data
          fi

      - name: Publier sur la branche gh-pages
        run: |
          cp index.html public/
          for f in og.png manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            [ -f "$f" ] && cp "$f" public/
          done
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then SITE="https://$REPO/"; else SITE="https://$OWNER.github.io/$REPO/"; fi
          sed -i "s#__SITE_URL__#$SITE#g; s#__REPO__#$GITHUB_REPOSITORY#g" public/index.html
          [ -f names.json ] && cp names.json public/ || echo '{}' > public/names.json
          touch public/.nojekyll
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Stats du $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
