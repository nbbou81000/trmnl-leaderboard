<style>
:root{
  --paper:#f2f0ed; --sheet:#fbfaf8; --ink:#1d1d1b; --ink2:#5d5c58; --rule:#dcdbd9; --rule2:#c9c7c3;
  --grey:#a3a19c; --accent:#f8654b; --accent2:#ff9280; --accent-soft:#ffe4d7; --accent-ink:#c7432b; --on-accent:#fff;
  --sage:#4b876f; --indigo:#5463b8; --mustard:#d6a228; --sky:#3f86b5; --plum:#9a4f86; --clay:#874b4b;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a1a1a; --sheet:#242423; --ink:#ecebe8; --ink2:#a9a8a3; --rule:#363634; --rule2:#474744;
  --grey:#76756f; --accent:#ff7c66; --accent2:#ff9280; --accent-soft:#3a2622; --accent-ink:#ff9d8a; --on-accent:#1a1a1a;
  --sage:#699b87; --indigo:#7f8ce0; --mustard:#e4b545; --sky:#63a6d4; --plum:#c27bb0; --clay:#b07a7a;
}}
:root[data-theme="dark"]{
  --paper:#1a1a1a; --sheet:#242423; --ink:#ecebe8; --ink2:#a9a8a3; --rule:#363634; --rule2:#474744;
  --grey:#76756f; --accent:#ff7c66; --accent2:#ff9280; --accent-soft:#3a2622; --accent-ink:#ff9d8a; --on-accent:#1a1a1a;
  --sage:#699b87; --indigo:#7f8ce0; --mustard:#e4b545; --sky:#63a6d4; --plum:#c27bb0; --clay:#b07a7a;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;border-top:4px solid var(--accent)}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:16px 16px 8px}
.brand{display:flex;align-items:center;gap:12px;margin:0;text-decoration:none}
.mark{flex:none;width:40px;height:32px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.mark span{width:30px;height:21px;border-radius:2px;background:var(--sheet);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:3px}
.mark i{display:block;width:4px;background:var(--ink)}
.brand b{display:block;font-stretch:125%;font-weight:800;font-size:1.12rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:.84rem;color:var(--ink2)}
.updated{font-size:.84rem;color:var(--ink2);display:flex;gap:10px;align-items:center}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;box-shadow:0 0 0 3px var(--accent-soft)}
.theme-btn{background:var(--sheet);border:1px solid var(--rule2);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.85rem}

nav.tabs{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule2);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{max-width:1180px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:12px 10px 9px;text-decoration:none;font-weight:600;font-stretch:88%;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a.mine::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:.2em}

main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
section[hidden]{display:none}
h2{font-stretch:112%;font-weight:750;font-size:1.35rem;margin:38px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
h3{font-weight:700;font-size:1rem;margin:0 0 10px}
p.lead{color:var(--ink2);max-width:64ch;margin:0 0 14px}
.muted{color:var(--ink2)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* Accueil */
.welcome{display:grid;gap:26px;align-items:end;margin:6px 0 8px}
@media(min-width:900px){.welcome{grid-template-columns:1.2fr 1fr}}
.welcome h2{font-stretch:125%;font-weight:850;font-size:clamp(2rem,6.4vw,3.4rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 14px;max-width:16ch}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.podium a{text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;border-radius:10px 10px 0 0;padding:10px;background:var(--sheet);border:1px solid var(--rule);border-bottom:0;min-height:120px}
.podium a:nth-child(1){order:2;min-height:170px;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.podium a:nth-child(2){order:1;min-height:140px}
.podium a:nth-child(3){order:3}
.podium .pl{font-stretch:125%;font-weight:900;font-size:2.2rem;line-height:1}
.podium .pn{font-weight:650;font-size:.92rem;margin-top:6px;overflow-wrap:anywhere}
.podium .pp{font-size:.8rem;opacity:.8}
.base{height:6px;background:var(--ink);border-radius:0 0 4px 4px}
.kpis{display:flex;flex-wrap:wrap;gap:6px 30px;margin:26px 0 6px}
.kpis div{font-size:.85rem;color:var(--ink2)}
.kpis b{display:block;color:var(--ink);font-stretch:115%;font-weight:800;font-size:1.55rem}
.mycard{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent2);border-radius:10px;padding:14px 16px;margin:0 0 18px}
.mycard b.big{font-stretch:125%;font-weight:900;font-size:1.8rem;color:var(--accent-ink)}

/* Recherche de profil */
.finder{position:relative;max-width:520px}
.finder input{width:100%;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;font-size:1.02rem}
.finder input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.hits{list-style:none;padding:0;margin:8px 0 0;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.hits:empty{display:none}
.hits li+li{border-top:1px solid var(--rule)}
.hits button{background:none;border:0;cursor:pointer;text-align:left;padding:10px 12px;width:100%}
.hits button:hover,.hits button:focus-visible{background:var(--accent-soft)}
.hits .muted{font-size:.86rem}
.help{font-size:.86rem;color:var(--ink2);margin:8px 0 0;max-width:60ch}

/* Profil */
.hero{display:grid;gap:22px;align-items:start}
@media(min-width:860px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.rankbig{font-stretch:125%;font-weight:900;font-size:clamp(4.6rem,19vw,9.5rem);line-height:.82;letter-spacing:-.045em;margin:0}
.rankbig em{font-style:normal;color:var(--accent)}
.rankbig .of{display:block;font-stretch:90%;font-weight:500;font-size:1.05rem;letter-spacing:0;line-height:1.3;margin-top:14px;color:var(--ink2)}
.who{margin:18px 0 0;font-size:1.25rem;font-weight:700}
.who span{font-weight:400;color:var(--ink2);font-size:.95rem;margin-left:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;padding:0;list-style:none}
.facts b{font-weight:750}
.moves{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1.5px solid var(--ink);border-radius:999px;padding:3px 11px;font-size:.86rem;font-weight:600;background:var(--sheet)}
.chip.good{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.bad{border-color:var(--clay);color:var(--clay)}
.chip.none{border-style:dashed;color:var(--ink2);border-color:var(--grey);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:4px 9px;font-size:.84rem;font-weight:650}
.target{margin-top:16px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--sheet);border-radius:0 8px 8px 0;max-width:54ch}
.ladder{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.ladder li{display:grid;grid-template-columns:3.4rem 1fr auto;gap:10px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--rule)}
.ladder li a{text-decoration:none}
.ladder .rk{font-stretch:110%;font-weight:750}
.ladder .pts{text-align:right;white-space:nowrap}
.ladder .gap{display:block;font-size:.8rem;color:var(--ink2)}
.ladder li.me{background:var(--accent);color:var(--on-accent);border-radius:6px;border-bottom-color:transparent;padding-left:10px}
.ladder li.me .gap{color:inherit;opacity:.85}
.tools-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;align-items:center}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:650;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule2)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.86rem}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);border-top:4px solid var(--c,var(--accent))}
.tile .lbl{font-size:.82rem;color:var(--ink2)}
.tile .rv{font-stretch:115%;font-weight:800;font-size:1.6rem;line-height:1.1;margin-top:4px}
.tile .rv small{font-stretch:100%;font-weight:400;font-size:.8rem;color:var(--ink2);margin-left:4px}
.tile .val{font-size:.85rem;margin-top:2px}
.tile .pc{height:5px;border-radius:3px;background:var(--rule);margin-top:8px;overflow:hidden}
.tile .pc i{display:block;height:100%;background:var(--c,var(--accent))}

.bar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.done i{background:var(--sage)}

/* Tableaux */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 12px}
.tools label{display:flex;flex-direction:column;font-size:.8rem;color:var(--ink2);gap:3px}
.tools input,.tools select{background:var(--sheet);border:1px solid var(--rule2);border-radius:8px;padding:7px 9px;min-width:0;color:var(--ink)}
.tools input[type=search]{width:min(300px,70vw)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filters button{background:var(--accent-soft);color:var(--accent-ink);border:0;border-radius:999px;padding:4px 11px;cursor:pointer;font-weight:600;font-size:.85rem}
.scroll{overflow-x:auto;border-top:2px solid var(--ink);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-stretch:88%;font-size:.93rem}
th,td{padding:8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th:first-child,td:first-child{padding-left:4px}
th.l,td.l{text-align:left}
td.name{white-space:normal;min-width:170px;max-width:340px}
th{font-weight:600;font-size:.8rem;color:var(--ink2);vertical-align:bottom}
th button{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:inherit;text-align:inherit}
th[aria-sort] button{color:var(--accent-ink)}
th[aria-sort="descending"] button::after{content:" ▾"}
th[aria-sort="ascending"] button::after{content:" ▴"}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sheet)}
tr.me td{background:var(--accent-soft)!important}
tr.me td:first-child{box-shadow:inset 4px 0 var(--accent)}
td .ico{width:22px;height:22px;vertical-align:middle;margin-right:8px;border-radius:4px;background:#fff;object-fit:contain}
td .sub{display:block;font-size:.78rem;color:var(--ink2)}
.pos{font-weight:700}
.up{color:var(--sage);font-weight:650}.down{color:var(--clay)}
.more{margin:14px 0 0}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--rule)}
.rows li a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows li a:hover{text-decoration:underline}
.rows .n{color:var(--ink2);font-size:.85rem}
.rows .v{font-weight:700;text-align:right}
.rows .bar{grid-column:2 / 4;height:6px}
.rows .s{grid-column:2 / 4;font-size:.8rem;color:var(--ink2)}
.rows li.me{background:var(--accent-soft);border-radius:6px}
.rows li.me a{font-weight:750}
.rows li.me .bar i{background:var(--accent-ink)}
.rows li.gapline{display:block;text-align:center;color:var(--ink2);font-size:.85rem;padding:4px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--rule2);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;font-weight:600;font-stretch:90%}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{color:var(--grey);cursor:not-allowed}
.chart{position:relative;height:260px}
.chart.tall{height:340px}
.note{font-size:.86rem;color:var(--ink2);margin:8px 0 0}
.hint{font-size:.8rem;color:var(--accent-ink);margin:6px 0 0}
.notice{border:1.5px dashed var(--grey);padding:12px 14px;border-radius:8px;color:var(--ink2);margin:0 0 16px;max-width:72ch}
.boardhead{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 12px}
.boardhead select{background:var(--sheet);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-weight:650;max-width:100%}

footer{max-width:1180px;margin:0 auto;padding:22px 16px 44px;color:var(--ink2);font-size:.82rem;border-top:1px solid var(--rule)}
footer p{margin:0 0 12px;max-width:80ch}
.flinks{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;margin:0 0 14px;padding:0;font-size:.86rem}
.flinks a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid transparent;padding-bottom:1px}
.flinks a:hover,.flinks a:focus-visible{border-bottom-color:var(--accent)}
.flinks a::after{content:" ↗";color:var(--accent);font-size:.8em}
.fbot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding-top:12px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--grey)}
.fbot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule2)}
.fbot a:hover{color:var(--ink2)}
.fbot .kofi{margin-left:auto;color:var(--accent-ink);border-bottom-color:var(--accent2)}
.fbot .kofi:hover{color:var(--accent-ink);border-bottom-color:var(--accent)}
.loading{padding:60px 0;text-align:center;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:50}
@media (prefers-reduced-motion:no-preference){
  .rankbig,.welcome h2{animation:ink .5s steps(4,end) both}
  @keyframes ink{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="brandLink"><span class="mark" aria-hidden="true"><span><i style="height:6px"></i><i style="height:11px"></i><i style="height:8px"></i></span></span>
    <span><b id="brandTitle">Palmarès des créateurs TRMNL</b><small id="brandSub"></small></span></a>
  <div class="updated"><span><span class="live"></span><span id="updated">…</span></span>
    <button class="theme-btn" id="langBtn" type="button"></button>
    <button class="theme-btn" id="themeBtn" type="button">◐</button></div>
</header>
<nav class="tabs" id="tabs"><div class="in" id="tabsIn"></div></nav>

<main>
  <div class="loading" id="loading">…</div>
  <section id="tab-accueil" hidden></section>
  <section id="tab-moi" hidden></section>
  <section id="tab-classements" hidden></section>
  <section id="tab-createurs" hidden></section>
  <section id="tab-recettes" hidden></section>
  <section id="tab-tendances" hidden></section>
  <section id="tab-analyses" hidden></section>
</main>

<footer id="footer"></footer>

<script>
/* ================= Réglages / Settings ================= */
const GOATCOUNTER = 'trmnl-leaderboard';     // votre code GoatCounter, ex. 'trmnl-palmares' pour https://trmnl-palmares.goatcounter.com
const REPO = '__REPO__';      // dépôt GitHub (rempli automatiquement par le workflow), pour le bouton « Claim this profile »
const KOFI = 'nicolasbouteiller';     // votre identifiant Ko-fi (ko-fi.com/…) ; laisser vide pour retirer le lien
const DEFAULT_GOAL = 50;    // objectif d'installations par recette / installs goal per recipe

/* ================= Langue / Language ================= */
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const qsLang = new URLSearchParams(location.search).get('lang');
let lang = ['fr', 'en'].includes(qsLang) ? qsLang : store.get('trmnl-lang', (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
const EN = () => lang === 'en';
const L = (fr, en) => EN() ? en : fr;
let LOC = 'fr-FR', NF, NF1;
function setLocale() {
  LOC = EN() ? 'en-US' : 'fr-FR';
  NF = new Intl.NumberFormat(LOC); NF1 = new Intl.NumberFormat(LOC, { maximumFractionDigits: 1 });
  document.documentElement.lang = lang;
}
setLocale();

// Onglets : identifiants internes (français) et adresses selon la langue
const SLUGS = { accueil: 'home', moi: 'me', classements: 'rankings', createurs: 'creators', recettes: 'recipes', tendances: 'trends', analyses: 'insights', createur: 'creator' };
const FROM_SLUG = Object.fromEntries(Object.entries(SLUGS).map(([fr, en]) => [en, fr]));
const hr = (k, arg) => '#' + (EN() ? SLUGS[k] : k) + (arg != null ? '/' + arg : '');

const nf1 = n => n == null || Number.isNaN(n) ? '—' : NF1.format(n);
const sg = n => n == null ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + NF.format(Math.abs(Math.round(n)));

const dfmt = iso => iso ? new Date(iso).toLocaleDateString(LOC, { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const ordTxt = n => { if (n == null) return '—'; if (!EN()) return n === 1 ? '1re' : `${n}e`; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const ord = n => { const t = ordTxt(n); const m = t.match(/^(\d+)(\D+)$/); return m ? `${m[1]}<sup>${m[2]}</sup>` : t; };

const ageDays = iso => iso ? Math.max(1, (Date.now() - Date.parse(iso)) / DAY) : null;
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return L("à l'instant", 'just now');
  if (m < 60) return L(`il y a ${m} min`, `${m} min ago`);
  const h = Math.round(m / 60);
  return h < 48 ? L(`il y a ${h} h`, `${h} h ago`) : L(`il y a ${Math.round(h / 24)} j`, `${Math.round(h / 24)} days ago`);
}
function rankMap(list, val, tie = () => 0) {
  const arr = list.map(x => [x, val(x), tie(x)]).filter(e => e[1] != null && !Number.isNaN(e[1]));
  arr.sort((a, b) => b[1] - a[1] || b[2] - a[2]);
  const m = new Map(); let r = 0, prev = null;
  arr.forEach(([x, v], k) => { if (v !== prev) { r = k + 1; prev = v; } m.set(x, r); });
  return { map: m, size: arr.length, list: arr.map(e => e[0]) };
}

/* ================= Chargement ================= */
async function getJSON(url) {
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'h=' + Math.floor(Date.now() / 3e5), { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url} : ${r.status}`);
  return r.json();
}
async function loadHist(kind) {
  if (!hist[kind]) hist[kind] = getJSON(`data/${kind}.json`).then(h => {
    const users = h.idx.map(([, u]) => u);
    h.totals = h.snaps.map(s => {
      const m = new Map();
      for (let k = 0; k < users.length; k++) { const i = s.i[k]; if (i == null) continue; m.set(users[k], (m.get(users[k]) || 0) + i + (s.f[k] || 0)); }
      return m;
    });
    h.global = h.snaps.map((s, k) => ({ t: s.t, i: s.i.reduce((a, v) => a + (v || 0), 0), f: s.f.reduce((a, v) => a + (v || 0), 0), n: s.i.filter(v => v != null).length, c: h.totals[k].size }));
    return h;
  }).catch(() => null);
  return hist[kind];
}
function userSeries(h, u) {
  return h.snaps.map((s, k) => {
    const tot = h.totals[k], mine = tot.get(u);
    if (mine == null) return { t: s.t, s: null, r: null };
    let r = 1; for (const v of tot.values()) if (v > mine) r++;
    return { t: s.t, s: mine, r };
  });
}

  } catch (e) {

      `Data is not available yet.<br>Run the "Mise à jour des stats TRMNL" workflow from the repository's Actions tab, then reload this page in two minutes.`);
    return;
  }
  D.creators.forEach(c => { byU.set(c.u, c); c.recipes = []; });
  D.recipes.forEach(r => { byR.set(r.id, r); byU.get(r.u)?.recipes.push(r); r.ipd = r.p ? r.i / ageDays(r.p) : null; });
  for (const m of METRICS) metricRanks[m.k] = rankMap(D.creators, m.val, c => c.s);
  const per = new Map();
  D.recipes.forEach(r => catsOf(r).forEach(k => { if (!per.has(k)) per.set(k, new Map()); const m = per.get(k); m.set(r.u, (m.get(r.u) || 0) + r.s); }));
  per.forEach((m, k) => catRanks.set(k, rankMap([...m.entries()], e => e[1])));
  $('#loading').remove();
  paintChrome();
  setInterval(() => { $('#updated').textContent = L(`Mis à jour ${ago(D.generated_at)}`, `Updated ${ago(D.generated_at)}`); }, 60000);
  window.addEventListener('hashchange', () => { route(); track(currentPath()); });
  document.addEventListener('click', e => { const a = e.target.closest('footer a'); if (a) track('lien-pied-de-page', true); });
  route();
}

/* ================= Routage ================= */
const TABS = ['accueil', 'moi', 'classements', 'createurs', 'recettes', 'tendances', 'analyses'];
function route() {
  if (!D) return;
  const [raw, arg] = (location.hash.slice(1) || '').split('?')[0].split('/');
  const tab = FROM_SLUG[raw] || raw || 'accueil';
  const t = tab === 'createur' ? 'moi' : (TABS.includes(tab) ? tab : 'accueil');
  document.querySelectorAll('nav.tabs a').forEach(a => {
    const on = a.dataset.tab === t && !(tab === 'createur' && !isMe(arg));
    a.toggleAttribute('aria-current', false); if (on) a.setAttribute('aria-current', 'page');
    if (a.dataset.tab === 'moi') a.classList.toggle('mine', !!me);
  });
  document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== 'tab-' + t; });
  ({ accueil: renderHome, moi: () => renderProfile(tab === 'createur' ? arg : me), classements: renderBoards, createurs: renderCreators, recettes: renderRecipes, tendances: renderTrends, analyses: renderAnalyses })[t]();
  window.scrollTo({ top: 0 });
}

function bindFinder(id, onPick) {
  const inp = document.getElementById(id), out = document.getElementById(id + '-hits'); if (!inp) return;
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase(); out.innerHTML = '';

    const hits = new Map();
    if (/^\d+$/.test(q) && byU.has(q)) hits.set(q, L('numéro exact', 'exact number'));
    for (const r of D.recipes) if (r.n.toLowerCase().includes(q) && !hits.has(r.u)) { hits.set(r.u, L(`auteur de « ${r.n} »`, `author of "${r.n}"`)); if (hits.size >= 8) break; }

      return `<li><button type="button" data-u="${u}"><b>${esc(nameOf(u))}</b><br><span class="muted">${esc(why)}, ${L(`${ord(c.r)} place`, `ranked ${ord(c.r)}`)}, ${nf(c.s)} pts</span></button></li>`; }).join('')

function badgesOf(c) {
  const b = [], N = D.creators.length, best = byR.get(c.best);
  if (c.r === 1) b.push(L('🥇 Numéro 1', '🥇 Number 1')); else if (c.r <= 3) b.push('🏆 Podium'); else if (c.r <= 10) b.push('⭐ Top 10'); else if (c.r <= 50) b.push('Top 50'); else if (c.r <= 100) b.push('Top 100');
  if (c.r > 100 && c.r / N <= .25) b.push(L('Quart supérieur', 'Top quarter'));
  if (best?.i >= 1000) b.push(L('Une recette à 1 000 installations', 'A 1,000-install recipe')); else if (best?.i >= 100) b.push(L('Une recette à 100 installations', 'A 100-install recipe'));
  const reached = c.recipes.filter(r => r.i >= goal).length;
  if (reached) b.push(L(`${reached} recette${reached > 1 ? 's' : ''} à ${goal} installations`, `${reached} recipe${reached > 1 ? 's' : ''} at ${goal} installs`));
  if (c.n >= 20) b.push(L('Très prolifique', 'Very prolific')); else if (c.n >= 10) b.push(L('Prolifique', 'Prolific'));
  if (c.first && Date.now() - Date.parse(c.first) < 90 * DAY) b.push(L('Révélation', 'Rising star'));
  if (c.first && Date.now() - Date.parse(c.first) > 365 * DAY) b.push(L('Pionnier', 'Pioneer'));
  if (c.i >= 50 && c.f / c.i >= .1) b.push(L('Souvent forké', 'Often forked'));
  const r7 = metricRanks.d7.map.get(c); if (r7 && c.d7 > 0 && r7 / metricRanks.d7.size <= .1) b.push(L('🔥 En forme cette semaine', '🔥 On fire this week'));
  return b;
}

let boardK = 's', boardCat = null, boardAll = false;
const strip = html => html.replace(/^<ol class="rows">|<\/ol>$/g, '');
function renderBoards() {
  const el = $('#tab-classements');
  const cats = [...catRanks.keys()].sort((a, b) => catRanks.get(b).size - catRanks.get(a).size);
  if (!boardCat || !catRanks.has(boardCat)) boardCat = cats[0];
  const B = BOARDS.find(b => b.k === boardK) || BOARDS[0];
  let items = [], val, fmt = B.fmt, link, sub;
  const mineFn = x => isMe(x.u);
  const avail = !B.need || D.history.windows[B.need];
  if (B.kind === 'cat') {
    const R = catRanks.get(boardCat);
    items = R.list.map(e => ({ u: e[0], s: e[1], __rank: R.map.get(e) }));
    val = x => x.s; fmt = v => nf(v) + ' pts'; link = x => `<a href="${hr('createur', x.u)}">${esc(nameOf(x.u))}</a>`;
    sub = x => L(`${byU.get(x.u)?.recipes.filter(r => catsOf(r).includes(boardCat)).length} recette(s) dans la catégorie`, `${byU.get(x.u)?.recipes.filter(r => catsOf(r).includes(boardCat)).length} recipe(s) in this category`);
  } else if (avail) {
    const src = B.kind === 'c' ? D.creators : D.recipes;
    const R = rankMap(src.filter(x => !B.filter || B.filter(x)), B.val, x => x.s);
    items = R.list.map(x => Object.assign(Object.create(x), { __rank: R.map.get(x) }));
    val = B.val;
    link = B.kind === 'c' ? creatorLink : recipeLink;
    sub = B.kind === 'c' ? (B.sub || (c => `${L(`${ordTxt(c.r)} au général`, `${ordTxt(c.r)} overall`)}, ${plural(c.n, 'recette', 'recipe')}`)) : (r => `${nameOf(r.u)}, ${L('publiée le', 'published')} ${dfmt(r.p)}`);
  }
  const total = items.length, LIMIT = 50;
  const myIdx = items.findIndex(mineFn);
  const shown = boardAll ? items : items.slice(0, LIMIT);
  const extra = !boardAll && myIdx >= LIMIT ? `<li class="gapline">…</li>` + strip(miniList(items.slice(Math.max(LIMIT, myIdx - 2), myIdx + 3), val, x => fmt(val(x)), link, sub, mineFn)) : '';
  const myLine = myIdx >= 0 ? `<p class="target" style="margin:0 0 14px">${L('Votre position dans ce classement', 'Your position in this ranking')}${CO()}<b>${ord(items[myIdx].__rank)}</b> ${L('sur', 'of')} ${nf(total)}, ${L('avec', 'with')} ${fmt(val(items[myIdx]))}.</p>`
    : (me && B.kind !== 'r' && avail ? `<p class="notice">${L("Vous n'apparaissez pas dans ce classement (critère non rempli).", "You don't appear in this ranking (criteria not met).")}</p>` : '');
  el.innerHTML = `<h2>${L('Classements', 'Rankings')}</h2>
    <p class="lead">${L(`${BOARDS.length} classements différents, créateurs et recettes. Les 10 premiers apparaissent aussi dans le graphique.`, `${BOARDS.length} different rankings, creators and recipes. The top 10 also appear in the chart.`)}</p>
    <div class="boardhead">
      <select id="boardSel" aria-label="${L('Classement', 'Ranking')}">${[[L('Créateurs', 'Creators'), false], [L('Recettes', 'Recipes'), true]].map(([g, isR]) => `<optgroup label="${g}">${BOARDS.filter(b => isR === (b.kind === 'r')).map(b => { const off = b.need && !D.history.windows[b.need]; return `<option value="${b.k}" ${b.k === B.k ? 'selected' : ''} ${off ? 'disabled' : ''}>${esc(b.t())}${off ? L(' (bientôt)', ' (soon)') : ''}</option>`; }).join('')}</optgroup>`).join('')}</select>
      ${B.kind === 'cat' ? `<select id="catSel" aria-label="${L('Catégorie', 'Category')}">${cats.map((k, i) => `<option value="${i}" ${k === boardCat ? 'selected' : ''}>${esc(catLabel(k))}</option>`).join('')}</select>` : ''}
    </div>
    <p class="muted" style="margin:0 0 14px">${esc(B.d())} ${L(`${nf(total)} classés.`, `${nf(total)} ranked.`)}</p>
    ${avail ? myLine : historyNotice()}
    ${avail ? `<div class="grid g2">
      <div class="sheet"><ol class="rows">${strip(miniList(shown, val, x => fmt(val(x)), link, sub, mineFn))}${extra}</ol>
        ${total > LIMIT ? `<button class="btn ghost more" type="button" id="boardMore">${boardAll ? L('Réduire', 'Show less') : L(`Afficher les ${nf(total)}`, `Show all ${nf(total)}`)}</button>` : ''}</div>
      <div class="sheet" style="align-self:start"><h3>Top 10</h3><div class="chart tall"><canvas id="chBoard"></canvas></div><p class="hint">${B.kind === 'r' ? L('Touchez une barre pour ouvrir la recette.', 'Tap a bar to open the recipe.') : L('Touchez une barre pour ouvrir le profil.', 'Tap a bar to open the profile.')}</p></div>
    </div>` : ''}`;
  $('#boardSel').onchange = e => { boardK = e.target.value; boardAll = false; renderBoards(); };
  $('#catSel')?.addEventListener('change', e => { boardCat = cats[+e.target.value]; renderBoards(); });
  $('#boardMore')?.addEventListener('click', () => { boardAll = !boardAll; renderBoards(); });
  if (!avail) return;
  const top10 = items.slice(0, 10), P = PAL();
  chart('chBoard', { type: 'bar', data: { labels: top10.map(x => { const s = B.kind === 'r' ? x.n : nameOf(x.u); return s.length > 22 ? s.slice(0, 21) + '…' : s; }),
    datasets: [{ data: top10.map(val), backgroundColor: top10.map((x, k) => mineFn(x) ? css('--ink') : P[k % P.length]), borderRadius: 5 }] },
    options: { indexAxis: 'y', plugins: { tooltip: { callbacks: { label: x => fmt(x.raw) } } }, scales: { y: { grid: { display: false } } } } },
    e0 => { const x = top10[e0.index]; if (B.kind === 'r') openRecipe(x); else go(hr('createur', x.u)); });
}

/* ================= Tableaux triables ================= */
function sortableTable({ cols, rows, key, dir = 'desc', rowHTML, rowClass = () => '', onRow, pageSize = 0 }) {
  const wrap = document.createElement('div');
  let sortK = key, sortD = dir, shown = pageSize;
  const draw = () => {
    const col = cols.find(c => c.k === sortK);
    const data = rows().slice().sort((a, b) => {
      const va = col.v(a), vb = col.v(b);
      if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
      const r = typeof va === 'string' ? va.localeCompare(vb, LOC) : va - vb;
      return sortD === 'asc' ? r : -r;
    });
    const part = pageSize ? data.slice(0, shown) : data;
    wrap.innerHTML = `<div class="scroll"><table><thead><tr>${cols.map(c => `<th class="${c.l ? 'l' : ''}" ${c.k === sortK ? `aria-sort="${sortD === 'asc' ? 'ascending' : 'descending'}"` : ''}><button type="button" data-k="${c.k}">${c.t}</button></th>`).join('')}</tr></thead>
      <tbody>${part.map(r => `<tr class="${rowClass(r)}">${rowHTML(r)}</tr>`).join('') || `<tr><td class="l muted" colspan="${cols.length}">${L('Aucun résultat pour ces filtres.', 'No results for these filters.')}</td></tr>`}</tbody></table></div>
      ${pageSize && data.length > shown ? `<button class="btn ghost more" type="button">${L(`Afficher ${Math.min(pageSize, data.length - shown)} de plus (${nf(data.length - shown)} restants)`, `Show ${Math.min(pageSize, data.length - shown)} more (${nf(data.length - shown)} left)`)}</button>` : ''}
      <p class="note">${plural(data.length, 'ligne', 'row')}.</p>`;
    wrap.querySelectorAll('th button').forEach(b => b.onclick = () => {
      const k = b.dataset.k, c = cols.find(x => x.k === k);
      if (k === sortK) sortD = sortD === 'asc' ? 'desc' : 'asc'; else { sortK = k; sortD = c.asc ? 'asc' : 'desc'; }
      draw();
    });
    wrap.querySelector('.more')?.addEventListener('click', () => { shown += pageSize; draw(); });
    wrap.querySelectorAll('tbody tr').forEach((tr, n) => tr.onclick = e => { if (!e.target.closest('a') && part[n]) onRow?.(part[n]); });
  };
  wrap.redraw = () => { shown = pageSize; draw(); };
  draw();
  return wrap;
}

let recipeFilter = {};

  const el = $('#tab-recettes');

  if (el.dataset.ready) return;
  el.dataset.ready = 1;
  const cats = new Map();
  D.recipes.forEach(r => catsOf(r).forEach(x => cats.set(x, (cats.get(x) || 0) + 1)));

    <p class="lead">${L(`${nf(D.recipes.length)} recettes publiques, classées par points. Touchez une ligne pour ouvrir la recette sur trmnl.com.`, `${nf(D.recipes.length)} public recipes, ranked by points. Tap a row to open the recipe on trmnl.com.`)}</p>
    <div class="tools">
      <label>${L('Rechercher', 'Search')}<input type="search" id="rq" placeholder="${L('Nom de recette', 'Recipe name')}"></label>

      { k: 'r', t: L('Rang', 'Rank'), v: r => r.r, asc: true }, { k: 'n', t: L('Recette', 'Recipe'), v: r => r.n, l: 1, asc: true },
      { k: 'u', t: L('Créateur', 'Creator'), v: r => byU.get(r.u)?.r, l: 1, asc: true },

/* ================= Tendances ================= */
let trendWin = null;
function renderTrends() {
  const el = $('#tab-tendances');
  const W = [['d1', L('1 heure', '1 hour')], ['d24', L('24 heures', '24 hours')], ['d7', L('7 jours', '7 days')], ['d30', L('30 jours', '30 days')]];
  const avail = W.filter(([k]) => D.history.windows[k]);
  if (!trendWin || !D.history.windows[trendWin]) trendWin = (avail.find(([k]) => k === 'd24') || avail.at(-1) || [null])[0];
  const week = Date.now() - 7 * DAY;
  const fresh = D.recipes.filter(r => r.p && Date.parse(r.p) >= week).sort((a, b) => b.s - a.s).slice(0, 15);
  const freshBlock = `<div class="sheet"><h3>${L('Nouvelles recettes de la semaine', "This week's new recipes")}</h3>${miniList(fresh, r => r.s, r => nf(r.s) + ' pts', recipeLink, r => `${nameOf(r.u)}, ${L('publiée le', 'published')} ${dfmt(r.p)}`)}</div>`;
  const moveSub = c => L(`de la ${ordTxt(c.r24)} à la ${ordTxt(c.r)} place`, `from ${ordTxt(c.r24)} to ${ordTxt(c.r)}`);
  const need24 = `<p class="muted">${L("Disponible après 24 heures d'historique.", 'Available after 24 hours of history.')}</p>`;
  let body = '';
  if (trendWin) {
    const k = trendWin;
    const rUp = D.recipes.filter(r => r[k] > 0).sort((a, b) => b[k] - a[k]).slice(0, 15);
    const cUp = D.creators.filter(c => c[k] > 0).sort((a, b) => b[k] - a[k]).slice(0, 15);
    const climb = D.creators.filter(c => deltaRank(c) > 0).sort((a, b) => deltaRank(b) - deltaRank(a)).slice(0, 15);
    const fall = D.creators.filter(c => deltaRank(c) < 0).sort((a, b) => deltaRank(a) - deltaRank(b)).slice(0, 10);
    const myC = me && byU.get(me);
    const myRank = myC && myC[k] != null ? 1 + D.creators.filter(c => (c[k] ?? -1) > myC[k]).length : null;
    const catGain = new Map(); D.recipes.forEach(r => { if (r[k] > 0) catsOf(r).forEach(x => catGain.set(x, (catGain.get(x) || 0) + r[k])); });
    const topCats = [...catGain].sort((a, b) => b[1] - a[1]).slice(0, 8);
    body = `${myC ? `<p class="target" style="margin:0 0 18px">${L(`Sur cette période, vous avez gagné <b>${plural(myC[k] || 0, 'point')}</b>`, `Over this period you gained <b>${plural(myC[k] || 0, 'point')}</b>`)}${myRank ? L(`, ${ord(myRank)} plus forte progression parmi les créateurs`, `, the ${ord(myRank)} biggest gain among creators`) : ''}.</p>` : ''}
    <div class="sheet" style="margin-bottom:14px"><h3>${L('Top 15 des recettes qui montent', 'Top 15 rising recipes')}</h3><div class="chart tall"><canvas id="chTrend"></canvas></div><p class="hint">${L('Touchez une barre pour ouvrir la recette.', 'Tap a bar to open the recipe.')}</p></div>
    <div class="grid g2">
      <div class="sheet"><h3>${L('Créateurs qui montent', 'Rising creators')}</h3>${miniList(cUp, c => c[k], c => sg(c[k]), creatorLink, c => `${L(`${ordTxt(c.r)} au général`, `${ordTxt(c.r)} overall`)}, ${plural(c.n, 'recette', 'recipe')}`)}</div>
      <div class="sheet"><h3>${L('Catégories en vogue', 'Trending categories')}</h3><div class="chart"><canvas id="chTrendCat"></canvas></div><p class="hint">${L('Touchez une barre pour voir les recettes de la catégorie.', 'Tap a bar to see recipes in that category.')}</p></div>
      <div class="sheet"><h3>${L('Plus fortes remontées en 24 h', 'Biggest climbs in 24 h')}</h3>${D.history.windows.d24 ? miniList(climb, deltaRank, c => '▲ ' + deltaRank(c), creatorLink, moveSub) : need24}</div>
      <div class="sheet"><h3>${L('Plus fortes baisses en 24 h', 'Biggest drops in 24 h')}</h3>${D.history.windows.d24 ? miniList(fall, c => -deltaRank(c), c => '▼ ' + -deltaRank(c), creatorLink, moveSub) : need24}</div>
      ${freshBlock}
    </div>`;
    setTimeout(() => {
      const P = PAL();
      chart('chTrend', { type: 'bar', data: { labels: rUp.map(r => r.n.length > 24 ? r.n.slice(0, 23) + '…' : r.n), datasets: [{ data: rUp.map(r => r[k]), backgroundColor: rUp.map(r => isMe(r.u) ? css('--ink') : P[0]), borderRadius: 5 }] },
        options: { indexAxis: 'y', plugins: { tooltip: { callbacks: { label: x => `${sg(x.raw)} pts, ${nameOf(rUp[x.dataIndex].u)}` } } }, scales: { y: { grid: { display: false } } } } },
        e0 => openRecipe(rUp[e0.index]));
      chart('chTrendCat', { type: 'bar', data: { labels: topCats.map(e => catLabel(e[0])), datasets: [{ data: topCats.map(e => e[1]), backgroundColor: topCats.map((_, i) => P[i % P.length]), borderRadius: 5 }] },
        options: { scales: { x: { grid: { display: false } } } } },
        e0 => { pending.recettes = { cat: topCats[e0.index][0] }; go(hr('recettes')); });
    });
  } else body = freshBlock;
  el.innerHTML = `<h2>${L('Tendances', 'Trends')}</h2><p class="lead">${L('Ce qui gagne des installations et des forks en ce moment.', 'What is gaining installs and forks right now.')}</p>${historyNotice()}
    <div class="tools"><div class="seg" role="group">${W.map(([k, l]) => `<button type="button" data-w="${k}" aria-pressed="${k === trendWin}" ${D.history.windows[k] ? '' : 'disabled'}>${l}</button>`).join('')}</div></div>${body}`;
  el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { trendWin = b.dataset.w; renderTrends(); });
}

  if (!src || src.snaps.length < 2) { note.textContent = L('La courbe apparaîtra après quelques relevés.', 'The chart will appear after a few snapshots.'); return; }
  const daily = src === h, g = src.global;
  note.textContent = L(`${g.length} relevés ${daily ? 'quotidiens' : 'horaires'}. Entre le premier et le dernier : ${sg(g.at(-1).i - g[0].i)} installations, ${sg(g.at(-1).n - g[0].n)} recettes, ${sg(g.at(-1).c - g[0].c)} créateurs.`,
    `${g.length} ${daily ? 'daily' : 'hourly'} snapshots. From first to last: ${sg(g.at(-1).i - g[0].i)} installs, ${sg(g.at(-1).n - g[0].n)} recipes, ${sg(g.at(-1).c - g[0].c)} creators.`);
  chart('aGrowth', { type: 'line', data: { labels: g.map(x => new Date(x.t).toLocaleString(LOC, daily ? { day: 'numeric', month: 'short' } : { weekday: 'short', hour: '2-digit' })), datasets: [
    { label: L('Installations', 'Installs'), data: g.map(x => x.i), borderColor: P[0], backgroundColor: ctx => fade(ctx, P[0]), fill: true, pointRadius: 0, borderWidth: 2.5, tension: .25, yAxisID: 'y' },
    { label: L('Recettes publiées', 'Published recipes'), data: g.map(x => x.n), borderColor: P[2], backgroundColor: P[2], pointRadius: 0, borderWidth: 2, tension: .25, yAxisID: 'y2' }] },
    options: { interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, position: 'bottom' } },
      scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0 } }, y: { ticks: { callback: v => NF.format(v) } }, y2: { position: 'right', grid: { display: false }, ticks: { precision: 0 } } } } });
}

init();
</script>
</body>
</html>
