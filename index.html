<style>
:root{
  --paper:#f2f0ed; --sheet:#fbfaf8; --ink:#1d1d1b; --ink2:#5d5c58; --rule:#dcdbd9; --rule2:#c9c7c3;
  --grey:#a3a19c; --accent:#f8654b; --accent2:#ff9280; --accent-soft:#ffe4d7; --accent-ink:#c7432b; --on-accent:#fff;
  --sage:#4b876f; --indigo:#5463b8; --mustard:#d6a228; --sky:#3f86b5; --plum:#9a4f86; --clay:#874b4b;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a1a1a; --sheet:#242423; --ink:#ecebe8; --ink2:#a9a8a3; --rule:#363634; --rule2:#474744;
  --grey:#76756f; --accent:#ff7c66; --accent2:#ff9280; --accent-soft:#3a2622; --accent-ink:#ff9d8a; --on-accent:#1a1a1a;
  --sage:#699b87; --indigo:#7f8ce0; --mustard:#e4b545; --sky:#63a6d4; --plum:#c27bb0; --clay:#b07a7a;
}}
:root[data-theme="dark"]{
  --paper:#1a1a1a; --sheet:#242423; --ink:#ecebe8; --ink2:#a9a8a3; --rule:#363634; --rule2:#474744;
  --grey:#76756f; --accent:#ff7c66; --accent2:#ff9280; --accent-soft:#3a2622; --accent-ink:#ff9d8a; --on-accent:#1a1a1a;
  --sage:#699b87; --indigo:#7f8ce0; --mustard:#e4b545; --sky:#63a6d4; --plum:#c27bb0; --clay:#b07a7a;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;border-top:4px solid var(--accent)}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:16px 16px 8px}
.brand{display:flex;align-items:center;gap:12px;margin:0;text-decoration:none}
.mark{flex:none;width:40px;height:32px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.mark span{width:30px;height:21px;border-radius:2px;background:var(--sheet);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:3px}
.mark i{display:block;width:4px;background:var(--ink)}
.brand b{display:block;font-stretch:125%;font-weight:800;font-size:1.12rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:.84rem;color:var(--ink2)}
.updated{font-size:.84rem;color:var(--ink2);display:flex;gap:10px;align-items:center}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;box-shadow:0 0 0 3px var(--accent-soft)}
.theme-btn{background:var(--sheet);border:1px solid var(--rule2);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.85rem}

nav.tabs{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule2);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{max-width:1180px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:12px 10px 9px;text-decoration:none;font-weight:600;font-stretch:88%;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
/* Ordinateur : tous les onglets restent visibles (un peu plus de largeur, un peu moins d'espace, deux lignes si l'écran est trop étroit) */
@media (min-width:900px){
  nav.tabs .in{max-width:1400px;flex-wrap:wrap;justify-content:center;overflow:visible}
  nav.tabs a{padding:12px 8px 9px}
}
nav.tabs a.mine::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:.2em}

main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
section[hidden]{display:none}
h2{font-stretch:112%;font-weight:750;font-size:1.35rem;margin:38px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
h3{font-weight:700;font-size:1rem;margin:0 0 10px}
p.lead{color:var(--ink2);max-width:64ch;margin:0 0 14px}
.muted{color:var(--ink2)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* Accueil */
.welcome{display:grid;gap:26px;align-items:end;margin:6px 0 8px}
@media(min-width:900px){.welcome{grid-template-columns:1.2fr 1fr}}
.welcome h2{font-stretch:125%;font-weight:850;font-size:clamp(2rem,6.4vw,3.4rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 14px;max-width:16ch}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.podium a{text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;border-radius:10px 10px 0 0;padding:10px;background:var(--sheet);border:1px solid var(--rule);border-bottom:0;min-height:120px}
.podium a:nth-child(1){order:2;min-height:170px;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.podium a:nth-child(2){order:1;min-height:140px}
.podium a:nth-child(3){order:3}
.podium .pl{font-stretch:125%;font-weight:900;font-size:2.2rem;line-height:1}
.podium .pn{font-weight:650;font-size:.92rem;margin-top:6px;overflow-wrap:anywhere}
.podium .pp{font-size:.8rem;opacity:.8}
.base{height:6px;background:var(--ink);border-radius:0 0 4px 4px}
.kpis{display:flex;flex-wrap:wrap;gap:6px 30px;margin:26px 0 6px}
.kpis div{font-size:.85rem;color:var(--ink2)}
.kpis b{display:block;color:var(--ink);font-stretch:115%;font-weight:800;font-size:1.55rem}
.mycard{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent2);border-radius:10px;padding:14px 16px;margin:0 0 18px}
.mycard b.big{font-stretch:125%;font-weight:900;font-size:1.8rem;color:var(--accent-ink)}

/* Recherche de profil */
.finder{position:relative;max-width:520px}
.finder input{width:100%;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;font-size:1.02rem}
.finder input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.hits{list-style:none;padding:0;margin:8px 0 0;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.hits:empty{display:none}
.hits li+li{border-top:1px solid var(--rule)}
.hits button{background:none;border:0;cursor:pointer;text-align:left;padding:10px 12px;width:100%}
.hits button:hover,.hits button:focus-visible{background:var(--accent-soft)}
.hits .muted{font-size:.86rem}
.help{font-size:.86rem;color:var(--ink2);margin:8px 0 0;max-width:60ch}

/* Profil */
.hero{display:grid;gap:22px;align-items:start}
@media(min-width:860px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.rankbig{font-stretch:125%;font-weight:900;font-size:clamp(4.6rem,19vw,9.5rem);line-height:.82;letter-spacing:-.045em;margin:0}
.rankbig em{font-style:normal;color:var(--accent)}
.rankbig .of{display:block;font-stretch:90%;font-weight:500;font-size:1.05rem;letter-spacing:0;line-height:1.3;margin-top:14px;color:var(--ink2)}
.who{margin:18px 0 0;font-size:1.25rem;font-weight:700}
.who span{font-weight:400;color:var(--ink2);font-size:.95rem;margin-left:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;padding:0;list-style:none}
.facts b{font-weight:750}
.moves{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1.5px solid var(--ink);border-radius:999px;padding:3px 11px;font-size:.86rem;font-weight:600;background:var(--sheet)}
.chip.good{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.bad{border-color:var(--clay);color:var(--clay)}
.chip.none{border-style:dashed;color:var(--ink2);border-color:var(--grey);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:4px 9px;font-size:.84rem;font-weight:650}
.target{margin-top:16px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--sheet);border-radius:0 8px 8px 0;max-width:54ch}
.ladder{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.ladder li{display:grid;grid-template-columns:3.4rem 1fr auto;gap:10px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--rule)}
.ladder li a{text-decoration:none}
.ladder .rk{font-stretch:110%;font-weight:750}
.ladder .pts{text-align:right;white-space:nowrap}
.ladder .gap{display:block;font-size:.8rem;color:var(--ink2)}
.ladder li.me{background:var(--accent);color:var(--on-accent);border-radius:6px;border-bottom-color:transparent;padding-left:10px}
.ladder li.me .gap{color:inherit;opacity:.85}
.tools-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;align-items:center}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:650;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule2)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.86rem}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);border-top:4px solid var(--c,var(--accent))}
.tile .lbl{font-size:.82rem;color:var(--ink2)}
.tile .rv{font-stretch:115%;font-weight:800;font-size:1.6rem;line-height:1.1;margin-top:4px}
.tile .rv small{font-stretch:100%;font-weight:400;font-size:.8rem;color:var(--ink2);margin-left:4px}
.tile .val{font-size:.85rem;margin-top:2px}
.tile .pc{height:5px;border-radius:3px;background:var(--rule);margin-top:8px;overflow:hidden}
.tile .pc i{display:block;height:100%;background:var(--c,var(--accent))}

.bar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.done i{background:var(--sage)}

/* Galerie */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .shot{position:relative;aspect-ratio:5/3;background:#fff;border-bottom:1px solid var(--rule)}
.card .shot img{width:100%;height:100%;object-fit:contain;display:block}
.card .shot .rk{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 7px;font-size:.75rem;font-weight:700}
.card .shot .fresh{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:2px 7px;font-size:.75rem;font-weight:700}
.card .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h4{margin:0;font-size:1rem;font-weight:700;line-height:1.25}
.card h4 a{text-decoration:none}
.card .desc{font-size:.85rem;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .desc.full{display:block;-webkit-line-clamp:unset;overflow:visible}
.archive-list{list-style:none;margin:0;padding:0}
.archive-list li{padding:8px 4px;border-bottom:1px solid var(--rule)}
.archive-list .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.archive-list .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.archive-list a.rn:hover{text-decoration:underline}
.archive-list .date{flex:none;font-weight:700;font-size:.85rem;white-space:nowrap}
.archive-list .sub{font-size:.8rem;color:var(--ink2);margin-top:2px}
.card .meta{font-size:.8rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:auto;padding-top:6px}
.card .meta b{color:var(--ink)}
.card .acts{display:flex;gap:6px;margin-top:8px}
.card .acts .btn{flex:1;text-align:center;font-size:.83rem;padding:6px 8px}
.card.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tagline{font-size:.8rem;color:var(--ink2)}

.card .ph{display:grid;place-items:center;height:100%;font-size:2.6rem;background:var(--paper)}
.card .shot .gal, .card .shot .gal .gtrack{height:100%}
.gal{position:relative}
.gal.multi .gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.gal.multi .gtrack img{flex:0 0 100%;scroll-snap-align:center;display:block;object-fit:contain;background:#fff}
.gdots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.gdots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.gdots span.on{background:#fff}
.gnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:0;width:28px;height:28px;border-radius:50%;font-size:1.15rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.gnav:hover{background:rgba(0,0,0,.65)}
.gnav.prev{left:6px}
.gnav.next{right:6px}
.wipd .hero-img .gal.multi,.wipd .hero-img .gal.multi .gtrack,.wipd .hero-img .gal.multi .gtrack img{height:340px}
.tl .gal{margin-top:8px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff}
.tl .gal img{max-width:100%;display:block}
.tl .gal.multi,.tl .gal.multi .gtrack,.tl .gal.multi .gtrack img{height:220px}
.wform-imgs{display:grid;gap:6px}
.ithumbs{display:flex;flex-wrap:wrap;gap:8px}
.pth{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--rule2);background:#fff}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:18px;height:18px;font-size:.65rem;line-height:1;cursor:pointer;padding:0}
.card.wip .desc{-webkit-line-clamp:3}
.card.wip{cursor:pointer}
.card.wip:hover{border-color:var(--accent2)}
.card .upd{font-size:.8rem;color:var(--accent-ink);font-weight:600}
.wipd h3{font-stretch:115%;font-size:1.4rem;margin:0 0 6px}
.wipd .hero-img{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:0 0 14px}
.wipd .hero-img img{width:100%;display:block}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 18px;border-left:2px solid var(--rule)}
.tl li{position:relative;padding:0 0 18px}
.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.tl time{font-size:.8rem;color:var(--ink2);font-weight:600}
.tl p{margin:3px 0 0}
.card.shipped{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
details.onhold summary{cursor:pointer;color:var(--ink2);margin:26px 0 12px}

.who2{display:inline-flex;align-items:center;gap:7px}
.av{width:22px;height:22px;border-radius:50%;vertical-align:middle;object-fit:cover}
.av.ph2{display:inline-grid;place-items:center;background:var(--rule);font-size:.75rem}
.wform{display:grid;gap:10px}
.wform label{display:grid;gap:4px;font-size:.86rem;font-weight:600}
.wform label.chk{display:flex;align-items:flex-start;gap:8px;font-weight:400}
.wform input:not([type=checkbox]):not([type=file]),.wform textarea,.wform select{font:inherit;font-weight:400;color:var(--ink);background:var(--sheet);border:1px solid var(--rule2);border-radius:8px;padding:8px 10px;width:100%}
.wform textarea{resize:vertical}
.wform .two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.wform .two{grid-template-columns:1fr}}
.wform .prev{max-width:100%;max-height:180px;border:1px solid var(--rule);border-radius:8px;margin-top:6px;background:#fff}
.err{color:var(--clay);font-weight:600;margin:0}
.coms{list-style:none;margin:0 0 12px;padding:0}
.coms li{padding:10px 0;border-bottom:1px solid var(--rule)}
.coms li.hid{opacity:.55}
.coms .ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.86rem}
.coms time,.tl time{font-size:.8rem;color:var(--ink2)}
.coms p{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cacts{display:flex;gap:12px;margin-top:4px}

<script>
/* ================= Réglages / Settings ================= */
const GOATCOUNTER = 'trmnl-leaderboard';     // votre code GoatCounter, ex. 'trmnl-palmares' pour https://trmnl-palmares.goatcounter.com
const REPO = '__REPO__';      // dépôt GitHub (rempli automatiquement par le workflow), pour le bouton « Claim this profile »
const KOFI = 'nicolasbouteiller';     // votre identifiant Ko-fi (ko-fi.com/…) ; laisser vide pour retirer le lien
const DEFAULT_GOAL = 50;    // objectif d'installations par recette / installs goal per recipe

/* Le bandeau d'accueil (disclaimer) ne se configure plus ici : vous le gérez
   directement sur le site, connecté en administrateur, via le bouton
   « Bandeau d'accueil » dans l'onglet « En élaboration ». Rien à modifier
   dans ce fichier pour changer son texte, son image ou l'activer/désactiver. */

/* Petit remerciement affiché juste sous le lien Ko-fi dans le pied de page.
   Laissez fr et en vides ("") pour ne rien afficher. À retirer/mettre à jour
   quand vous voulez. */
const THANKS_DONOR = {
  fr: '',
  en: '',
};

/* Remerciement discret ajouté parmi les liens du pied de page (pas de lien
   externe obligatoire : laissez url vide pour un simple texte, sans clic). */
const THANKS_DATA = {
  label: '',   // ex. 'Merci à @pseudo pour les données historiques'
  url: '',     // ex. lien vers son profil Discord/GitHub, ou '' pour aucun lien
};

/* ================= Langue / Language ================= */
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const qsLang = new URLSearchParams(location.search).get('lang');
let lang = ['fr', 'en'].includes(qsLang) ? qsLang : store.get('trmnl-lang', (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
const EN = () => lang === 'en';
const L = (fr, en) => EN() ? en : fr;
let LOC = 'fr-FR', NF, NF1;
function setLocale() {
  LOC = EN() ? 'en-US' : 'fr-FR';
  NF = new Intl.NumberFormat(LOC); NF1 = new Intl.NumberFormat(LOC, { maximumFractionDigits: 1 });
  document.documentElement.lang = lang;
}
setLocale();

// Onglets : identifiants internes (français) et adresses selon la langue
const SLUGS = { accueil: 'home', moi: 'me', galerie: 'gallery', elaboration: 'in-the-making', classements: 'rankings', createurs: 'creators', recettes: 'recipes', tendances: 'trends', semaine: 'this-week', analyses: 'insights', trmnl: 'trmnl', eink: 'eink', jour: 'daily', pronos: 'predictions', createur: 'creator' };
const FROM_SLUG = Object.fromEntries(Object.entries(SLUGS).map(([fr, en]) => [en, fr]));
const hr = (k, arg) => '#' + (EN() ? SLUGS[k] : k) + (arg != null ? '/' + arg : '');
const TAB_LABELS = () => ({ accueil: L('Accueil', 'Home'), moi: L('Mon profil', 'My profile'), galerie: L('Galerie', 'Gallery'), elaboration: L('En élaboration', 'In the making'), classements: L('Classements', 'Rankings'), createurs: L('Créateurs', 'Creators'), recettes: L('Recettes', 'Recipes'), tendances: L('Tendances', 'Trends'), semaine: L('Cette semaine', 'This week'), analyses: L('Analyses', 'Insights'), trmnl: L('Actu TRMNL', 'TRMNL news'), eink: L('Actu e-ink', 'E-ink news'), jour: L('Recette du jour', 'Recipe of the day'), pronos: L('Pronostics', 'Predictions') });

/* ================= Outils / Helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const nf = n => n == null || Number.isNaN(n) ? '—' : NF.format(Math.round(n));
const nf1 = n => n == null || Number.isNaN(n) ? '—' : NF1.format(n);
const sg = n => n == null ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + NF.format(Math.abs(Math.round(n)));
const sgc = n => n == null ? '—' : `<span class="${n > 0 ? 'up' : n < 0 ? 'down' : ''}">${sg(n)}</span>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dfmt = iso => iso ? new Date(iso).toLocaleDateString(LOC, { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const ordTxt = n => { if (n == null) return '—'; if (!EN()) return n === 1 ? '1re' : `${n}e`; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const ord = n => { const t = ordTxt(n); const m = t.match(/^(\d+)(\D+)$/); return m ? `${m[1]}<sup>${m[2]}</sup>` : t; };
const CO = () => L(' : ', ': ');
const plural = (n, fr, en) => { const w = EN() ? (en ?? fr) : fr; return `${nf(n)} ${w}${Math.abs(n) > 1 ? 's' : ''}`; };
const DAY = 864e5;
const BREAKOUT_VERIFY_DAYS_JS = 7; // doit rester égal à BREAKOUT_VERIFY_DAYS dans scripts/spotlight.mjs
const ageDays = iso => iso ? Math.max(1, (Date.now() - Date.parse(iso)) / DAY) : null;
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return L("à l'instant", 'just now');
  if (m < 60) return L(`il y a ${m} min`, `${m} min ago`);
  const h = Math.round(m / 60);
  return h < 48 ? L(`il y a ${h} h`, `${h} h ago`) : L(`il y a ${Math.round(h / 24)} j`, `${Math.round(h / 24)} days ago`);
}
function rankMap(list, val, tie = () => 0) {
  const arr = list.map(x => [x, val(x), tie(x)]).filter(e => e[1] != null && !Number.isNaN(e[1]));
  arr.sort((a, b) => b[1] - a[1] || b[2] - a[2]);
  const m = new Map(); let r = 0, prev = null;
  arr.forEach(([x, v], k) => { if (v !== prev) { r = k + 1; prev = v; } m.set(x, r); });
  return { map: m, size: arr.length, list: arr.map(e => e[0]) };
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }
const monthLbl = (k, long) => new Date(k + '-01T12:00:00').toLocaleDateString(LOC, long ? { month: 'long', year: 'numeric' } : { month: 'short', year: '2-digit' });

/* ================= Progression (sparkline sur 30 jours) ================= */
function sparkSVG(rawValues) {
  let i = 0; while (i < rawValues.length && rawValues[i] == null) i++;   // ignore les jours avant la première apparition (recette pas encore publiée)
  const vals = rawValues.slice(i);
  for (let k = 1; k < vals.length; k++) if (vals[k] == null) vals[k] = vals[k - 1];   // comble un trou isolé avec la dernière valeur connue
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), n = vals.length;
  const pts = vals.map((v, k) => {
    const x = Math.round(k * 80 / (n - 1));
    const y = max === min ? 11 : Math.round(20 - ((v - min) / (max - min)) * 18);
    return `${x},${y}`;
  }).join(' ');
  return `<svg width="70" height="20" viewBox="0 0 80 22" class="spark" aria-hidden="true" focusable="false"><polyline points="${pts}"></polyline></svg>`;
}
// Construit, une fois les données chargées, la progression sur 30 jours (installs + forks) de chaque recette et de chaque créateur.
function buildSparklines() {
  recipeSpark.clear(); creatorSpark.clear();
  if (!DAILY?.snaps?.length) return;
  const snaps = DAILY.snaps.slice(-30);
  const pos = new Map(DAILY.idx.map(([id], k) => [id, k]));
  const creatorDaily = new Map();   // u -> tableau de 30 sommes (installs + forks du jour, sur toutes ses recettes)
  D.recipes.forEach(r => {
    const k = pos.get(r.id);
    const series = k == null ? [] : snaps.map(s => s.i[k] == null ? null : s.i[k] + (s.f[k] || 0));
    recipeSpark.set(r.id, sparkSVG(series));
    if (k != null) {
      let acc = creatorDaily.get(r.u);
      if (!acc) creatorDaily.set(r.u, acc = new Array(snaps.length).fill(0));
      snaps.forEach((s, d) => { acc[d] += s.i[k] == null ? 0 : s.i[k] + (s.f[k] || 0); });
    }
  });
  creatorDaily.forEach((series, u) => creatorSpark.set(u, sparkSVG(series)));
}

/* ================= Statistiques de visite (GoatCounter) ================= */
/* Mesure d'audience maison (Supabase) : un numéro tiré au hasard, gardé 13 mois sur l'appareil, sans cookie ni adresse IP.
   Exemptée de consentement par la CNIL (statistiques anonymes uniquement, durée limitée, droit de refus en pied de page). */
const NOCOUNT_KEY = 'trmnl-nocount', VID_KEY = 'trmnl-vid', ADMIN_DEV_KEY = 'trmnl-admin-device';
// Provenance transmise dans l'adresse : étiquette d'un lien de partage (?via=reddit) ou d'un lien publié (?via=discord, ?utm_source=…),
// et site d'origine relayé par les pages de partage (?ref=…). Lue une fois, puis retirée de l'adresse affichée.
const ENTRY = (() => {
  const q = new URLSearchParams(location.search);
  const e = { via: q.get('via') || q.get('utm_source') || null, ref: q.get('ref') || null };
  if (['via', 'ref', 'utm_source', 'utm_medium', 'utm_campaign'].some(k => q.has(k))) {
    ['via', 'ref', 'utm_source', 'utm_medium', 'utm_campaign'].forEach(k => q.delete(k));
    try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); } catch {}
  }
  return e;
})();
const counted = () => store.get(NOCOUNT_KEY, '') !== '1';
function visitorId() {
  const today = new Date().toISOString().slice(0, 10);
  let v = null; try { v = JSON.parse(store.get(VID_KEY, '') || 'null'); } catch {}
  if (!v?.id || !v.since || Date.now() - Date.parse(v.since) > 395 * 864e5) {
    const id = crypto.randomUUID?.() || 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
    v = { id, since: today }; store.set(VID_KEY, JSON.stringify(v));
  }
  return { id: v.id, isNew: v.since === today };
}
let firstHit = true;
const sbRPC = (fn, body) => fetch(`${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {
  method: 'POST', keepalive: true,
  headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
  body: JSON.stringify(body) }).catch(() => {});
// Robots qui font tourner la page (aperçus de liens, tests automatiques, aspirateurs) : écartés
const looksAutomated = () => navigator.webdriver || /bot|crawl|spider|preview|headless|lighthouse|pagespeed|gtmetrix|pingdom|uptime|monitor|scrap|puppeteer|playwright|phantom/i.test(navigator.userAgent)
  || !(navigator.languages && navigator.languages.length) || (outerWidth === 0 && outerHeight === 0);
const countOK = () => counted() && store.get(ADMIN_DEV_KEY, '') !== '1' && wipReady() && !looksAutomated();
// Une visite ne compte qu'une fois la page vue au moins 2 secondes, ou au premier geste (clic, touche, défilement)
let human = false, humanTimer = null; const humanQueue = [];
const confirmHuman = () => { if (human) return; human = true; clearTimeout(humanTimer); humanQueue.splice(0).forEach(f => f()); };
const armHuman = () => { clearTimeout(humanTimer); if (!human && document.visibilityState === 'visible') humanTimer = setTimeout(confirmHuman, 2000); };
['pointerdown', 'keydown', 'scroll', 'touchstart', 'wheel'].forEach(ev => addEventListener(ev, confirmHuman, { once: true, passive: true, capture: true }));
document.addEventListener('visibilitychange', armHuman); armHuman();
// L'appareil de l'administrateur n'est plus compté, et ses visites passées sont effacées une fois pour toutes
function markAdminDevice() {
  if (store.get(ADMIN_DEV_KEY, '') === '1') return;
  store.set(ADMIN_DEV_KEY, '1');
  let v = null; try { v = JSON.parse(store.get(VID_KEY, '') || 'null'); } catch {}
  if (v?.id) api().forgetVisitor?.(v.id).catch(() => {});
}
// Navigateur, système et taille d'écran, en grandes familles seulement
function deviceInfo() {
  const ua = navigator.userAgent;
  const browser = /Edg\//.test(ua) ? 'Edge' : /OPR\/|Opera/.test(ua) ? 'Opera' : /SamsungBrowser/.test(ua) ? 'Samsung' : /Vivaldi/.test(ua) ? 'Vivaldi'
    : /Firefox|FxiOS/.test(ua) ? 'Firefox' : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'Autre';
  const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iOS'
    : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'macOS' : /CrOS/.test(ua) ? 'ChromeOS' : /Linux/.test(ua) ? 'Linux' : 'Autre';
  const w = screen.width || innerWidth;
  const scr = w < 480 ? '<480' : w < 768 ? '480-768' : w < 1024 ? '768-1024' : w < 1440 ? '1024-1440' : w < 1920 ? '1440-1920' : '1920+';
  let tz = null; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch {}
  return { p_browser: browser, p_os: os, p_screen: scr, p_tz: tz };
}
function countVisit(path, kind = 'view') {
  try {
    if (!countOK()) return;
    const tab = kind === 'event' ? path : (path.split('#')[1] || 'accueil').toLowerCase();
    if (tab === 'stats') return;   // la page de statistiques ne se compte pas elle-même
    const send = () => {
      if (!countOK()) return;
      let ref = null, via = null;
      if (kind === 'view' && firstHit) {
        via = ENTRY.via;
        const r = ENTRY.ref || document.referrer;
        if (r) { try { const h = (r.includes('/') ? new URL(r).hostname : r).replace(/^www\./, ''); if (h && h !== location.hostname) ref = h; } catch {} }
        firstHit = false;
      }
      const v = visitorId();
      sbRPC('track_hit', { p_visitor: v.id, p_kind: kind, p_path: tab, p_new: v.isNew, p_ref: ref, p_via: via, p_lang: EN() ? 'en' : 'fr', p_mobile: matchMedia('(pointer:coarse)').matches, ...deviceInfo() });
      startPing();
    };
    if (human) send(); else humanQueue.push(send);
  } catch {}
}
// Temps passé : un signal toutes les 30 secondes tant que la page est visible (4 heures au plus)
let pingTimer = null, pingAcc = 0, pingLast = 0, pingTotal = 0;
function startPing() {
  if (pingTimer) return;
  pingLast = Date.now();
  const flush = () => {
    if (pingAcc < 5 || !countOK()) return;
    sbRPC('track_ping', { p_visitor: visitorId().id, p_seconds: Math.round(Math.min(pingAcc, 60)) }); pingAcc = 0;
  };
  pingTimer = setInterval(() => {
    const now = Date.now();
    if (document.visibilityState === 'visible' && pingTotal < 4 * 3600) { const dt = Math.min((now - pingLast) / 1000, 35); pingAcc += dt; pingTotal += dt; }
    pingLast = now;
    if (pingAcc >= 30) flush();
  }, 5000);
  document.addEventListener('visibilitychange', () => {
    const now = Date.now();
    if (document.visibilityState === 'hidden') { pingAcc += Math.min((now - pingLast) / 1000, 35); flush(); }
    pingLast = now;
  });
}
function track(path, event = false) {
  if (location.hash.split('/')[0] !== '#stats') countVisit(path, event ? 'event' : 'view');
  if (!GOATCOUNTER || !window.goatcounter?.count) return;
  window.goatcounter.count({ path, title: event ? path : document.title, event });
}
const currentPath = () => { const [tab] = (location.hash.slice(1) || '').split('?')[0].split('/'); const t = FROM_SLUG[tab] || tab || 'accueil'; return location.pathname + (EN() ? 'en/' : '') + '#' + t; };
if (GOATCOUNTER) {
  window.goatcounter = { no_onload: true };
  const s = document.createElement('script');
  s.async = true; s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  s.onload = () => window.goatcounter.count({ path: currentPath(), title: document.title });
  document.head.append(s);
}
setTimeout(() => countVisit(currentPath()), 0);   // première page vue, comptée même si GoatCounter est bloqué

/* ================= État / State ================= */
let D = null, NAMES = {}, byU = new Map(), byR = new Map(), metricRanks = {}, catRanks = new Map();
let DAILY = null, recipeSpark = new Map(), creatorSpark = new Map();
let SPOT = null, SPOT_HIST = null, SPOT_BREAK = null;
let me = store.get('trmnl-me', '');
let myName = store.get('trmnl-myname', '');
let goal = +store.get('trmnl-goal', DEFAULT_GOAL) || DEFAULT_GOAL;
const hist = {}, charts = {};
const pending = { recettes: null, createurs: null };
const NONE = '\u0000none';
const isMe = u => !!me && String(u) === String(me);
const nameOf = u => (isMe(u) && myName) ? myName : ((NAMES[u] && String(NAMES[u]).trim()) || L(`Créateur #${u}`, `Creator #${u}`));
const hasName = u => (isMe(u) && myName) || (NAMES[u] && String(NAMES[u]).trim());
const catsOf = r => r.c.length ? r.c : [NONE];
const catLabel = k => k === NONE ? L('sans catégorie', 'uncategorized') : k;

/* ================= Chargement ================= */
async function getJSON(url) {
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'h=' + Math.floor(Date.now() / 3e5), { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url} : ${r.status}`);
  return r.json();
}
async function loadHist(kind) {
  if (!hist[kind]) hist[kind] = getJSON(`data/${kind}.json`).then(h => {
    const users = h.idx.map(([, u]) => u);
    h.totals = h.snaps.map(s => {
      const m = new Map();
      for (let k = 0; k < users.length; k++) { const i = s.i[k]; if (i == null) continue; m.set(users[k], (m.get(users[k]) || 0) + i + (s.f[k] || 0)); }
      return m;
    });
    h.global = h.snaps.map((s, k) => ({ t: s.t, i: s.i.reduce((a, v) => a + (v || 0), 0), f: s.f.reduce((a, v) => a + (v || 0), 0), n: s.i.filter(v => v != null).length, c: h.totals[k].size }));
    return h;
  }).catch(() => null);
  return hist[kind];
}
function userSeries(h, u) {
  return h.snaps.map((s, k) => {
    const tot = h.totals[k], mine = tot.get(u);
    if (mine == null) return { t: s.t, s: null, r: null };
    let r = 1; for (const v of tot.values()) if (v > mine) r++;
    return { t: s.t, s: mine, r };
  });
}

/* ================= Compte à rebours vers l'objectif ================= */
// Rythme récent : moyenne depuis la publication pour une recette de moins de 30 jours, sinon les 30 derniers jours.
function etaText(r, target) {
  const left = target - r.s; if (left <= 0) return '';
  const age = r.p ? Math.max(1, (Date.now() - Date.parse(r.p)) / DAY) : null;
  const rate = age != null && age < 30 ? r.s / age : (r.d30 ?? 0) / 30;
  if (!(rate > 0)) return L('pas encore de rythme', 'no pace yet');
  const days = left / rate;
  if (days > 365) return L("plus d'un an", 'over a year');
  const n = Math.max(1, Math.round(days));
  const when = new Date(Date.now() + days * DAY).toLocaleDateString(LOC, { day: 'numeric', month: 'short' });
  return `<span title="${L('Estimation au rythme récent, pas une promesse', 'Estimate at the recent pace, not a promise')}">${L(`≈ ${n} j (${when})`, `≈ ${n} d (${when})`)}</span>`;
}

function badgesOf(c) {
  const b = [], N = D.creators.length, best = byR.get(c.best);
  if (c.r === 1) b.push(L('🥇 Numéro 1', '🥇 Number 1')); else if (c.r <= 3) b.push('🏆 Podium'); else if (c.r <= 10) b.push('⭐ Top 10'); else if (c.r <= 50) b.push('Top 50'); else if (c.r <= 100) b.push('Top 100');
  if (c.r > 100 && c.r / N <= .25) b.push(L('Quart supérieur', 'Top quarter'));
  if (best?.i >= 1000) b.push(L('Une recette à 1 000 installations', 'A 1,000-install recipe')); else if (best?.i >= 100) b.push(L('Une recette à 100 installations', 'A 100-install recipe'));
  const reached = c.recipes.filter(r => r.s >= goal).length;
  if (reached) b.push(L(`${reached} recette${reached > 1 ? 's' : ''} à ${goal} connexions`, `${reached} recipe${reached > 1 ? 's' : ''} at ${goal} connections`));
  if (c.n >= 20) b.push(L('Très prolifique', 'Very prolific')); else if (c.n >= 10) b.push(L('Prolifique', 'Prolific'));
  if (c.first && Date.now() - Date.parse(c.first) < 90 * DAY) b.push(L('Révélation', 'Rising star'));
  if (c.first && Date.now() - Date.parse(c.first) > 365 * DAY) b.push(L('Pionnier', 'Pioneer'));
  if (c.i >= 50 && c.f / c.i >= .1) b.push(L('Souvent forké', 'Often forked'));
  const r7 = metricRanks.d7.map.get(c); if (r7 && c.d7 > 0 && r7 / metricRanks.d7.size <= .1) b.push(L('🔥 En forme cette semaine', '🔥 On fire this week'));
  return b;
}

  el.querySelectorAll('[data-fresh]').forEach(b => b.onclick = () => { galFresh = b.dataset.fresh; galShown = 24; renderGallery(); });

let sb = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function client() {
  if (sb) return sb;
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true } });

const ok = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const realApi = {
  async session() {
    const c = await client(); const { data } = await c.auth.getSession();
    const user = data.session?.user || null; let profile = null;
    if (user) profile = ok(await c.from('profiles').select('*').eq('id', user.id).maybeSingle());
    return { user, profile };
  },
  async signIn() { const c = await client(); ok(await c.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } })); },
  async signOut() { const c = await client(); await c.auth.signOut(); },
  async list() {
    const c = await client();
    const projects = ok(await c.from('projects').select('*, profiles(name,avatar), updates(count), comments(count)').order('updated_at', { ascending: false }));
    const imgs = ok(await c.from('updates').select('project_id,images,created_at').order('created_at', { ascending: false }).limit(300));
    return projects.map(p => ({ ...p, n_updates: p.updates?.[0]?.count || 0, n_comments: p.comments?.[0]?.count || 0, last_images: imgs.find(i => i.project_id === p.id && i.images?.length)?.images || [] }));
  },
  async detail(id) {
    const c = await client();
    const [updates, comments] = await Promise.all([
      c.from('updates').select('*').eq('project_id', id).order('created_at', { ascending: false }).then(ok),
      c.from('comments').select('*, profiles(name,avatar)').eq('project_id', id).order('created_at').then(ok),
    ]);
    return { updates, comments };
  },
  async saveProject(fields, id) { const c = await client(); return ok(id ? await c.from('projects').update(fields).eq('id', id).select().single() : await c.from('projects').insert(fields).select().single()); },
  async deleteProject(p) { const c = await client(); const ups = ok(await c.from('updates').select('images').eq('project_id', p.id)); await this.removeImages([...(p.images || []), ...ups.flatMap(u => u.images || [])]); ok(await c.from('projects').delete().eq('id', p.id)); },
  async setHidden(id, hidden) { const c = await client(); ok(await c.from('projects').update({ hidden }).eq('id', id)); },
  async addUpdate(project_id, body, images) { const c = await client(); ok(await c.from('updates').insert({ project_id, body, images })); },
  async deleteUpdate(u) { const c = await client(); await this.removeImages(u.images || []); ok(await c.from('updates').delete().eq('id', u.id)); },
  async addComment(project_id, body) { const c = await client(); ok(await c.from('comments').insert({ project_id, body })); },

  async hideComment(id, hidden) { const c = await client(); ok(await c.from('comments').update({ hidden }).eq('id', id)); },
  async report(target, reason) { const c = await client(); const r = await c.from('reports').insert({ ...target, reason }); if (r.error && !/duplicate|unique/i.test(r.error.message)) throw new Error(r.error.message); },
  async visitStats(days) { const c = await client(); return ok(await c.rpc('visit_stats', { p_days: days })); },
  async visitLive() { const c = await client(); return ok(await c.rpc('visit_live')); },
  async forgetVisitor(id) { const c = await client(); return ok(await c.rpc('forget_visitor', { p_visitor: id })); },
  async reports() { const c = await client(); return ok(await c.from('reports').select('*').order('created_at', { ascending: false })); },
  async clearReport(id) { const c = await client(); ok(await c.from('reports').delete().eq('id', id)); },
  async ban(uid, value) { const c = await client(); ok(await c.rpc('set_banned', { target: uid, value })); },
  async siteSettings() { const c = await client(); return ok(await c.from('site_settings').select('*').eq('id', 1).maybeSingle()); },
  async setBanner(d) { const c = await client(); ok(await c.rpc('set_banner', { p: d })); },
  async setDisclaimer(fields) { const c = await client(); ok(await c.rpc('set_disclaimer', { p_enabled: fields.enabled, p_img: fields.img, p_text_fr: fields.text_fr, p_text_en: fields.text_en, p_show_stats: fields.show_stats, p_frequency: fields.frequency, p_expires_at: fields.expires_at, p_font: fields.font, p_color: fields.color })); },
  async uploadDisclaimerImage(file) {
    const c = await client();
    const blob = await shrink(file, 640, 0.82);   // le bandeau reste compact quelle que soit la taille d'origine (CSS + petite résolution stockée)
    const path = `${wipMe.id}/disclaimer-${Date.now().toString(36)}.webp`;
    ok(await c.storage.from('wip').upload(path, blob, { contentType: 'image/webp', upsert: false, cacheControl: '31536000' }));

  async upload(file) {

// Réduit la capture avant envoi : 1000 px de large au maximum, format WebP
const thumbOf = path => String(path).replace(/\.webp$/, '-t.webp');
const isExternalImg = x => /^(https?:|data:|blob:)/.test(x);

// Une ou plusieurs captures : vignette simple, ou carrousel glissable façon Reddit au-delà de une
function galleryHTML(paths, alt, cardMode = false) {
  const src1 = x => cardMode && !isExternalImg(x) ? imgURL(thumbOf(x)) : imgURL(x);
  const full1 = x => cardMode && !isExternalImg(x) ? imgURL(x) : '';
  const imgTag = (x, extraAlt) => { const full = full1(x);
    return `<img src="${esc(src1(x))}" ${full ? `data-full="${esc(full)}" onerror="if(this.dataset.full&&this.src!==this.dataset.full)this.src=this.dataset.full"` : ''} alt="${esc(alt)}${extraAlt || ''}" loading="lazy">`; };
  if (paths.length <= 1) return paths.length ? `<div class="gal">${imgTag(paths[0])}</div>` : '';
  return `<div class="gal multi"><div class="gtrack">${paths.map((x, i) => imgTag(x, ` ${i + 1}/${paths.length}`)).join('')}</div>
    <div class="gdots">${paths.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('')}</div>
    <button type="button" class="gnav prev" aria-label="${esc(L('Précédente', 'Previous'))}">‹</button>
    <button type="button" class="gnav next" aria-label="${esc(L('Suivante', 'Next'))}">›</button></div>`;
}
function wireGalleries(root) {
  root.querySelectorAll('.gal.multi').forEach(g => {
    if (g.dataset.wired) return; g.dataset.wired = '1';
    const track = g.querySelector('.gtrack'), dots = [...g.querySelectorAll('.gdots span')];
    const upd = () => { const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); };
    track.addEventListener('scroll', () => { clearTimeout(track._t); track._t = setTimeout(upd, 80); }, { passive: true });
    g.querySelector('.prev')?.addEventListener('click', e => { e.stopPropagation(); track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }); });
    g.querySelector('.next')?.addEventListener('click', e => { e.stopPropagation(); track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }); });
  });
}

// Sélecteur de captures : jusqu'à IMG_MAX images, avec miniatures et retrait individuel
function setupPicker(root, existing = []) {
  const kept = existing.slice(), added = [];
  const thumbs = root.querySelector('.ithumbs'), input = root.querySelector('.picker-input'), addBtn = root.querySelector('.add-img'), count = root.querySelector('.picker-count');
  const total = () => kept.length + added.length;
  const render = () => {
    thumbs.innerHTML = kept.map((path, i) => `<span class="pth"><img src="${esc(imgURL(thumbOf(path)) || imgURL(path))}" alt=""><button type="button" data-k="kept" data-i="${i}">✕</button></span>`).join('')
      + added.map((file, i) => `<span class="pth"><img src="${URL.createObjectURL(file)}" alt=""><button type="button" data-k="added" data-i="${i}">✕</button></span>`).join('');
    count.textContent = `${total()} / ${IMG_MAX}`;
    addBtn.disabled = total() >= IMG_MAX;
    thumbs.querySelectorAll('button').forEach(b => b.onclick = () => { (b.dataset.k === 'kept' ? kept : added).splice(+b.dataset.i, 1); render(); });
  };
  addBtn.onclick = () => input.click();
  input.onchange = () => {
    for (const file of input.files) { if (total() >= IMG_MAX) break; if (/^image\//.test(file.type)) added.push(file); }
    input.value = ''; render();
  };
  render();
  return { kept: () => kept, added: () => added };
}
function shrink(file, max = 1000, q = 0.82) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error(L('Choisissez une image.', 'Please choose an image.')));
    const img = new Image(); img.onload = () => {
      const w = Math.min(max, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? res(b) : rej(new Error('image')), 'image/webp', q); URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error(L('Image illisible.', 'Unreadable image.'))); img.src = URL.createObjectURL(file);
  });
}

// ---------- Publication officielle : déclarée par l'auteur, ou repérée automatiquement
const STOP = new Set(['trmnl', 'the', 'and', 'for', 'les', 'des', 'une', 'plugin', 'recipe', 'recette']);
const toks = t => new Set(String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !STOP.has(w)));
function sameName(a, b) { const A = toks(a), B = toks(b); if (!A.size || !B.size) return false; let n = 0; A.forEach(w => { if (B.has(w)) n++; }); return n / Math.min(A.size, B.size) >= 0.6; }
function shippedOf(p) {

  const from = Date.parse(p.created_at) - 2 * DAY;
  const r = D.recipes.find(r => r.p && Date.parse(r.p) >= from && r.u === p.creator_id && sameName(r.n, p.name));

}
const ago2 = iso => { const d = Math.floor((Date.now() - Date.parse(iso)) / DAY); return d <= 0 ? L("aujourd'hui", 'today') : d === 1 ? L('hier', 'yesterday') : L(`il y a ${d} jours`, `${d} days ago`); };
const fdate = iso => new Date(iso).toLocaleDateString(LOC, { day: 'numeric', month: 'long', year: 'numeric' });

// Nom affiché : le nom revendiqué s'il existe, sinon le nom Discord ; lien vers le profil de créateur si on le connaît
const wipWho = p => {
  const label = p.creator_id && hasName(p.creator_id) ? nameOf(p.creator_id) : (p.profiles?.name || (p.creator_id ? nameOf(p.creator_id) : ''));

function wipCard(p, ship) {
  const st = WSTAT[p.status] || WSTAT.building, r = ship?.r;

function modal(html, cls = '') {
  const wrap = document.createElement('div'); wrap.className = 'modal';
  wrap.innerHTML = `<div class="box ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(wrap);
  const close = () => { wrap.remove(); document.removeEventListener('keydown', esck); };
  const esck = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esck);
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  wrap.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  return { wrap, close, $: s => wrap.querySelector(s) };
}
const counter = (input, out, max) => { const f = () => { out.textContent = `${input.value.length} / ${max}`; out.classList.toggle('down', input.value.length > max); }; input.addEventListener('input', f); f(); };

      <div class="wform-imgs"><label>${L('Captures', 'Screenshots')}</label><div class="ithumbs"></div>
        <div class="row"><button type="button" class="btn ghost small add-img">+ ${L('Ajouter une capture', 'Add a screenshot')}</button><small class="muted picker-count"></small></div>

      <label>${L('Sortie prévue (facultatif)', 'Expected release (optional)')}<input name="eta" maxlength="40" value="${esc(p?.eta || '')}"></label>
      <p class="muted" style="font-size:.84rem;margin:0">${wipProfile?.creator_status === 'verified'
        ? L(`✔ Ce projet sera relié à votre profil de créateur (${esc(nameOf(wipProfile.creator_id))}).`, `✔ This project will be linked to your creator profile (${esc(nameOf(wipProfile.creator_id))}).`)
        : L('Il sera affiché sous votre nom Discord. Liez votre numéro de créateur pour le relier à votre profil et faire repérer sa publication automatiquement.', 'It will show under your Discord name. Link your creator number to connect it to your profile and have its release spotted automatically.')}</p>
      <label>${L('Lien pour suivre le projet (facultatif)', 'Link to follow the project (optional)')}<input name="link" type="url" placeholder="https://" value="${esc(p?.link || '')}"></label>
      ${edit ? (wipProfile?.creator_status === 'verified' ? `<label>${L('Déjà publiée ? Numéro de la recette', 'Already published? Recipe number')}<input name="shipped_recipe" inputmode="numeric" value="${esc(p?.shipped_recipe || '')}" placeholder="123456"></label>` : '')
        : `<label class="chk"><input type="checkbox" name="consent" required> ${L("C'est mon propre projet, et j'accepte qu'il soit affiché publiquement.", "This is my own project and I'm happy for it to be shown publicly.")}</label>`}

    </form>`, 'wipd');
  const f = m.$('form'), err = m.$('.err');
  counter(f.description, m.$('#dc'), DESC_MAX);
  const picker = setupPicker(f, p?.images || []);
  f.onsubmit = async e => {
    e.preventDefault(); err.hidden = true;
    const val = n => (f[n]?.value || '').trim();
    const fields = { name: val('name'), description: val('description'), status: val('status'), category: val('category'),
      eta: val('eta') || null, link: val('link') || null };
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    if (edit && f.shipped_recipe) {
      fields.shipped_recipe = (val('shipped_recipe').match(/\d{3,}/) || [])[0] || null;
      if (fields.shipped_recipe && byR.get(fields.shipped_recipe)?.u !== wipProfile.creator_id) return fail(L("Ce numéro ne correspond à aucune de vos recettes publiées.", "This number doesn't match any of your published recipes."));
    }
    if (fields.name.length < 2) return fail(L('Donnez un nom à votre projet.', 'Please name your project.'));
    if (fields.link && !/^https?:\/\//i.test(fields.link)) return fail(L('Le lien doit commencer par https://', 'The link must start with https://'));
    if (!edit && !f.consent.checked) return fail(L('Merci de cocher la case de consentement.', 'Please tick the consent box.'));
    const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = '…';
    try {
      const keptPaths = picker.kept(), addedFiles = picker.added();
      const uploaded = await Promise.all(addedFiles.map(file => api().upload(file)));
      fields.images = [...keptPaths, ...uploaded];
      const removed = (p?.images || []).filter(x => !keptPaths.includes(x));
      if (removed.length) api().removeImages(removed).catch(() => {});
      await api().saveProject(fields, p?.id);
      m.close(); track(edit ? 'projet-modifie' : 'projet-publie', true);
      toast(edit ? L('Projet enregistré', 'Project saved') : L('Projet publié !', 'Project published!'));
      await wipRefresh();
    } catch (x) { fail(trErr(x.message)); btn.disabled = false; btn.textContent = edit ? L('Enregistrer', 'Save') : L('Publier', 'Publish'); }
  };
}

        const images = await Promise.all(files.map(file => api().upload(file)));

    if (cf) { counter(cf.body, m.$('#cc'), COM_MAX); cf.onsubmit = async e => {
      e.preventDefault(); const er = cf.querySelector('.err'); er.hidden = true; const b = cf.querySelector('[type=submit]'); b.disabled = true;
      try { const body = cf.body.value.trim(); if (!body) throw new Error(L('Le commentaire est vide.', 'The comment is empty.'));
        await api().addComment(p.id, body); track('commentaire-publie', true); await draw(); wipRefresh();
      } catch (x) { er.textContent = trErr(x.message); er.hidden = false; b.disabled = false; } }; }
    m.wrap.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const act = b.dataset.act, id = +b.dataset.id;
      try {
        if (act === 'edit') { m.close(); return wipForm(p); }
        if (act === 'signin') { store.set('trmnl-wip-return', hr('elaboration')); return api().signIn(); }
        if (act === 'del') { if (!confirm(L('Supprimer ce projet, ses avancées et ses commentaires ?', 'Delete this project, its updates and comments?'))) return; await api().deleteProject(p); m.close(); return wipRefresh(); }
        if (act === 'hide') { await api().setHidden(p.id, !p.hidden); p.hidden = !p.hidden; await draw(); return wipRefresh(); }
        if (act === 'ban') { if (!confirm(L('Bloquer cette personne ? Elle ne pourra plus publier ni commenter.', 'Block this person? They will no longer be able to post or comment.'))) return; await api().ban(b.dataset.uid, true); return toast(L('Personne bloquée', 'User blocked')); }
        if (act === 'delupd') { if (!confirm(L('Supprimer cette avancée ?', 'Delete this update?'))) return; await api().deleteUpdate(d.updates.find(u => u.id === id)); await draw(); return wipRefresh(); }
        if (act === 'delcom') { if (!confirm(L('Supprimer ce commentaire ?', 'Delete this comment?'))) return; await api().deleteComment(id); await draw(); return wipRefresh(); }
        if (act === 'hidecom') { await api().hideComment(id, b.dataset.h === '1'); return draw(); }
        if (act === 'reportc' || act === 'reportp') {
          const reason = prompt(L('Pourquoi signalez-vous ce contenu ? (facultatif)', 'Why are you reporting this? (optional)')) ?? null; if (reason === null) return;
          await api().report(act === 'reportc' ? { comment_id: id } : { project_id: p.id }, reason.slice(0, 200)); return toast(L('Merci, signalement transmis.', 'Thanks, report sent.'));
        }
      } catch (x) { toast(trErr(x.message)); }
    });
  };
  draw();
}

async function loadLive() {
  if (!$('#stBody') || document.hidden && statsLiveAt) return;
  try {
    const V = await api().visitLive(); statsLiveAt = Date.now();
    $('#stNow').textContent = nf(V.now);
    $('#stLive').title = L(`${V.last5} sur les 5 dernières minutes`, `${V.last5} in the last 5 minutes`);

/* ================= Vignette partageable ================= */
async function shareCard(r) {
  if (!r) return;
  track('vignette-ouverte', true);
  const W = 1200, H = 630;
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="box"><canvas id="cardCv" width="${W}" height="${H}"></canvas>
    <div class="row"><button class="btn ghost" type="button" id="cardClose">${L('Fermer', 'Close')}</button>
      <button class="btn ghost" type="button" id="cardDl">${L("Télécharger l'image", 'Download image')}</button>
      <button class="btn" type="button" id="cardLink">${L('Copier le lien', 'Copy link')}</button>
      <button class="btn" type="button" id="cardShare" hidden>${L('Partager', 'Share')}</button></div>
    <p class="note">${L(`L'image fait 1200 × 630. Le lien, lui, affiche automatiquement un aperçu quand on le colle sur Discord, Reddit, Slack ou X : <code>${esc(shareURL(r))}</code>`,
      `The image is 1200 × 630. The link unfurls into a preview on its own when pasted on Discord, Reddit, Slack or X: <code>${esc(shareURL(r))}</code>`)}</p></div>`;
  document.body.append(wrap);
  wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
  $('#cardClose', wrap).onclick = () => wrap.remove();
  const cv = $('#cardCv', wrap), x = cv.getContext('2d');
  const F = (w, size, wd = 100) => `${w} ${size}px Archivo, system-ui, sans-serif`;
  const PAPER = '#f2f0ed', INK = '#1d1d1b', INK2 = '#5d5c58', ACC = '#f8654b';
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  x.fillStyle = ACC; x.fillRect(0, 0, W, 10);
  // aperçu de la recette
  const img = new Image(); img.crossOrigin = 'anonymous';
  const drawn = await new Promise(res => { img.onload = () => res(true); img.onerror = () => res(false); img.src = r.sc ? r.sc + (r.sc.includes('?') ? '&' : '?') + 'x=card' : ''; });
  const bx = 660, by = 120, bw = 500, bh = 300;
  x.fillStyle = '#fff'; x.fillRect(bx, by, bw, bh);
  if (drawn) x.drawImage(img, bx, by, bw, bh);
  x.strokeStyle = INK; x.lineWidth = 3; x.strokeRect(bx, by, bw, bh);
  // textes
  const wrapText = (t, max, size, weight, color, y0, lh, limit = 3) => {
    x.font = F(weight, size); x.fillStyle = color;
    const words = String(t).split(' '); let line = '', y = y0, n = 0;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (x.measureText(test).width > max && line) {
        x.fillText(line, 60, y); y += lh; line = w; if (++n >= limit - 1) break;
      } else line = test;
    }
    if (line) { let t2 = line; while (x.measureText(t2).width > max) t2 = t2.slice(0, -2) + '…'; x.fillText(t2, 60, y); y += lh; }
    return y;
  };
  x.font = F(700, 24); x.fillStyle = ACC; x.fillText('TRMNL RECIPE', 60, 96);
  let y = wrapText(r.n, 540, 60, 800, INK, 168, 66, 2);
  y = wrapText(r.d || '', 540, 26, 400, INK2, y + 16, 34, 3);
  const c = byU.get(r.u);
  x.font = F(600, 26); x.fillStyle = INK;
  x.fillText(`${L('par', 'by')} ${nameOf(r.u)}`, 60, Math.min(y + 34, 468));
  x.font = F(700, 30); x.fillStyle = INK;
  x.fillText(`${nf(r.i)} ${L('installations', 'installs')}   ·   ${nf(r.f)} forks   ·   #${r.r} ${L('au classement', 'overall')}`, 60, 520);
  // pied
  x.strokeStyle = '#dcdbd9'; x.lineWidth = 2; x.beginPath(); x.moveTo(60, 556); x.lineTo(W - 60, 556); x.stroke();
  x.font = F(400, 22); x.fillStyle = INK2;
  x.fillText(location.host + location.pathname.replace(/\/$/, ''), 60, 590);
  x.textAlign = 'right'; x.fillStyle = ACC; x.font = F(700, 22);
  x.fillText(c ? `${nameOf(r.u)} · #${c.r} / ${nf(D.creators.length)}` : '', W - 60, 590);
  x.textAlign = 'left';
  const name = `trmnl-${r.n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}.png`;
  $('#cardDl', wrap).onclick = () => cv.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); track('vignette-telechargee', true);
  }, 'image/png');

const PRONO_MAX = 150;
let pronoList = null, pronoPeriod = 'month', dailyPos = null;
function isoWeekKey(ms) {
  const d = new Date(ms); d.setUTCHours(0, 0, 0, 0);
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const y = d.getUTCFullYear();
  return `${y}-W${String(Math.ceil(((d - Date.UTC(y, 0, 1)) / DAY + 1) / 7)).padStart(2, '0')}`;
}
// Connexions d'une recette au premier relevé quotidien postérieur à ms (null si ce relevé n'existe pas encore)
function connAfter(id, ms) {
  if (!DAILY?.snaps?.length) return null;
  if (!dailyPos) dailyPos = new Map(DAILY.idx.map(([rid], k) => [rid, k]));
  const snap = DAILY.snaps.find(x => Date.parse(x.t) >= ms);
  if (!snap) return null;
  const k = dailyPos.get(id);
  return k == null || snap.i[k] == null ? 0 : snap.i[k] + (snap.f[k] || 0);
}
// Score d'un pari : connexions gagnées entre le premier relevé après le pari et le premier relevé 7 jours plus tard
function scoreBet(b) {
  const t0 = Date.parse(b.created_at), r = byR.get(b.recipe_id);
  const start = connAfter(b.recipe_id, t0);
  const end = connAfter(b.recipe_id, t0 + 7 * DAY);
  const done = end != null;
  const base = start ?? r?.s ?? 0;
  const gain = done ? end - base : (r?.s ?? base) - base;
  return { r, start: base, gain: Math.max(0, gain), done, valid: base <= PRONO_MAX, verdict: t0 + 7 * DAY };
}

      ${left > 0 ? `<div class="emore"><button class="btn ghost" type="button" id="einkMore">${L(`Afficher plus d'articles`, 'Show more articles')} (${left})</button>
        <span class="muted">${L(`${shown.length} articles affichés sur ${list.length}`, `Showing ${shown.length} of ${list.length} articles`)}</span></div>` : ''}`

  el.querySelectorAll('.ethumb').forEach(img => img.addEventListener('error', () => {

/* ================= Tableaux triables ================= */
function sortableTable({ cols, rows, key, dir = 'desc', rowHTML, rowClass = () => '', onRow, pageSize = 0 }) {
  const wrap = document.createElement('div');
  let sortK = key, sortD = dir, shown = pageSize;
  const draw = () => {
    const col = cols.find(c => c.k === sortK);
    const data = rows().slice().sort((a, b) => {
      const va = col.v(a), vb = col.v(b);
      if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
      const r = typeof va === 'string' ? va.localeCompare(vb, LOC) : va - vb;
      return sortD === 'asc' ? r : -r;
    });
    const part = pageSize ? data.slice(0, shown) : data;
    wrap.innerHTML = `<div class="scroll"><table><thead><tr>${cols.map(c => `<th class="${c.l ? 'l' : ''}" ${c.k === sortK ? `aria-sort="${sortD === 'asc' ? 'ascending' : 'descending'}"` : ''}><button type="button" data-k="${c.k}">${c.t}</button></th>`).join('')}</tr></thead>
      <tbody>${part.map(r => `<tr class="${rowClass(r)}">${rowHTML(r)}</tr>`).join('') || `<tr><td class="l muted" colspan="${cols.length}">${L('Aucun résultat pour ces filtres.', 'No results for these filters.')}</td></tr>`}</tbody></table></div>
      ${pageSize && data.length > shown ? `<button class="btn ghost more" type="button">${L(`Afficher ${Math.min(pageSize, data.length - shown)} de plus (${nf(data.length - shown)} restants)`, `Show ${Math.min(pageSize, data.length - shown)} more (${nf(data.length - shown)} left)`)}</button>` : ''}
      <p class="note">${plural(data.length, 'ligne', 'row')}.</p>`;
    wrap.querySelectorAll('th button').forEach(b => b.onclick = () => {
      const k = b.dataset.k, c = cols.find(x => x.k === k);
      if (k === sortK) sortD = sortD === 'asc' ? 'desc' : 'asc'; else { sortK = k; sortD = c.asc ? 'asc' : 'desc'; }
      draw();
    });
    wrap.querySelector('.more')?.addEventListener('click', () => { shown += pageSize; draw(); });
    wrap.querySelectorAll('tbody tr').forEach((tr, n) => tr.onclick = e => { if (!e.target.closest('a') && part[n]) onRow?.(part[n]); });
  };
  wrap.redraw = () => { shown = pageSize; draw(); };
  draw();
  return wrap;
}

        ${myC ? `<li class="me"><span class="n">${myC.r}</span><span>${L('vous', 'you')}</span><span class="v">${nf1(100 * myC.s / TOT)} %</span><div class="bar"><i style="width:${Math.max(1, 100 * myC.s / TOT)}%"></i></div></li>` : ''}</ol></div>
      <div class="sheet"><h3>${L('Qui détient les points ?', 'Who holds the points?')}</h3><div class="chart"><canvas id="aShare"></canvas></div><p class="hint">${L('Touchez une part pour ouvrir le profil.', 'Tap a slice to open the profile.')}</p></div>
      <div class="sheet"><h3>${L('Courbe de concentration', 'Concentration curve')}</h3><div class="chart"><canvas id="aLorenz"></canvas></div>
        <p class="note">${L('Part cumulée des points selon la part des créateurs, du plus petit au plus gros. La diagonale serait une répartition parfaitement égale.', 'Cumulative share of points by share of creators, smallest to largest. The diagonal would be a perfectly equal split.')}</p></div>
      <div class="sheet"><h3>${L('Créateurs selon leur nombre de recettes', 'Creators by number of recipes')}</h3><div class="chart"><canvas id="aNrec"></canvas></div><p class="hint">${L('Touchez une barre pour lister ces créateurs.', 'Tap a bar to list those creators.')}</p></div>
    </div>

    <h2>${L('Recettes', 'Recipes')}</h2>
    <div class="grid g2">
      <div class="sheet"><h3>${L('Recettes selon leurs installations', 'Recipes by installs')}</h3><div class="chart"><canvas id="aInst"></canvas></div><p class="hint">${L('Touchez une barre pour lister ces recettes.', 'Tap a bar to list those recipes.')}</p></div>
      <div class="sheet"><h3>${L('Publications et nouveaux créateurs par mois', 'Recipes and new creators per month')}</h3><div class="chart"><canvas id="aMonth"></canvas></div><p class="hint">${L('Touchez un mois pour voir ses recettes.', "Tap a month to see its recipes.")}</p></div>
      <div class="sheet"><h3>${L('Âge des recettes et installations', 'Recipe age vs installs')}</h3><div class="chart tall"><canvas id="aAge"></canvas></div><p class="hint">${L("Chaque point est une recette. Touchez-la pour l'ouvrir.", 'Each dot is a recipe. Tap it to open.')}</p></div>
      <div class="sheet"><h3>${L('Catégories les plus installées', 'Most installed categories')}</h3><div class="chart tall"><canvas id="aCat"></canvas></div><p class="hint">${tapBar}</p></div>
    </div>

    <h2>${L('Catégories', 'Categories')}</h2>
    <div class="scroll"><table><thead><tr><th class="l">${L('Catégorie', 'Category')}</th><th>${L('Recettes', 'Recipes')}</th><th>${L('Créateurs', 'Creators')}</th><th>Installs</th><th>Forks</th><th>${L('Moy./recette', 'Avg/recipe')}</th><th class="l">${L('Meneur', 'Leader')}</th></tr></thead>
      <tbody>${catList.map(([k, o], i) => { const lead = catRanks.get(k)?.list[0]; return `<tr data-ci="${i}"><td class="l">${esc(catLabel(k))}</td><td>${o.n}</td><td>${o.u.size}</td><td class="pos">${nf(o.i)}</td><td>${nf(o.f)}</td><td>${nf1(o.i / o.n)}</td><td class="l">${lead ? esc(nameOf(lead[0])) : '—'}</td></tr>`; }).join('')}</tbody></table></div>

    <h2>${L('Où se placent les créateurs', 'Where creators stand')}</h2>
    <div class="sheet"><h3>${L('Nombre de recettes et points de chaque créateur', 'Recipes and points for every creator')}</h3><div class="chart tall"><canvas id="aScatter"></canvas></div>
      <p class="note">${L(`Échelles logarithmiques. Couleur selon le rang${myC ? " ; le gros point noir, c'est vous" : ''}. Touchez un point pour ouvrir le profil ; touchez la légende pour masquer un groupe.`, `Log scales. Colour by rank${myC ? '; the big black dot is you' : ''}. Tap a dot to open the profile; tap the legend to hide a group.`)}</p></div>

    <h2>${L('Croissance de la communauté', 'Community growth')}</h2>
    <div class="sheet"><h3>${L('Installations et recettes publiées', 'Installs and published recipes')}</h3><div class="chart"><canvas id="aGrowth"></canvas></div><p class="note" id="aGrowthNote"></p></div>`;

  el.querySelectorAll('tr[data-ci]').forEach(tr => tr.onclick = () => { pending.recettes = { cat: catList[+tr.dataset.ci][0] }; go(hr('recettes')); });
  const P = PAL(), ink = css('--ink'), grey = css('--grey'), noGrid = { grid: { display: false } };

  const top10 = C.slice(0, 10), rest = TOT - top10.reduce((a, c) => a + c.s, 0);
  chart('aShare', { type: 'doughnut', data: { labels: [...top10.map(c => nameOf(c.u)), L('Tous les autres', 'Everyone else')], datasets: [{ data: [...top10.map(c => c.s), rest], backgroundColor: [...top10.map((_, k) => P[k % P.length]), css('--rule2')], borderColor: css('--sheet'), borderWidth: 2 }] },
    options: { cutout: '55%', plugins: { legend: { display: true, position: 'right', labels: { boxWidth: 8, font: { size: 11 } } }, tooltip: { callbacks: { label: x => `${x.label}${CO()}${nf1(100 * x.raw / TOT)} %` } } } } },
    e0 => { if (e0.index < 10) go(hr('createur', top10[e0.index].u)); });

  const asc = sortedS.slice().reverse(), tot = asc.reduce((a, b) => a + b, 0) || 1;
  let acc = 0; const pts = [{ x: 0, y: 0 }]; asc.forEach((v, k) => { acc += v; pts.push({ x: 100 * (k + 1) / asc.length, y: 100 * acc / tot }); });
  chart('aLorenz', { type: 'scatter', data: { datasets: [
    { data: pts, showLine: true, borderColor: P[0], backgroundColor: ctx => fade(ctx, P[0]), fill: true, pointRadius: 0, borderWidth: 2.5 },
    { data: [{ x: 0, y: 0 }, { x: 100, y: 100 }], showLine: true, borderColor: grey, borderDash: [4, 4], pointRadius: 0, borderWidth: 1 }] },
    options: { plugins: { tooltip: { callbacks: { label: x => L(`${nf1(x.raw.x)} % des créateurs : ${nf1(x.raw.y)} % des points`, `${nf1(x.raw.x)} % of creators: ${nf1(x.raw.y)} % of points`) } } }, scales: { x: { min: 0, max: 100, ticks: { callback: v => v + ' %' } }, y: { min: 0, max: 100, ticks: { callback: v => v + ' %' } } } } });

  const nb = [['1', 1, 1], ['2', 2, 2], [L('3 à 5', '3–5'), 3, 5], [L('6 à 10', '6–10'), 6, 10], [L('11 à 20', '11–20'), 11, 20], [L('21 et +', '21+'), 21, 1e9]];
  const myB = myC ? nb.findIndex(([, a, b]) => myC.n >= a && myC.n <= b) : -1;
  chart('aNrec', { type: 'bar', data: { labels: nb.map(x => x[0]), datasets: [{ data: nb.map(([, a, b]) => C.filter(c => c.n >= a && c.n <= b).length), backgroundColor: nb.map((_, k) => k === myB ? ink : P[2]), borderRadius: 5 }] },
    options: { plugins: { tooltip: { callbacks: { label: x => `${x.raw} ${L('créateurs', 'creators')}${x.dataIndex === myB ? L(' (dont vous)', ' (including you)') : ''}` } } }, scales: { x: noGrid, y: { ticks: { precision: 0 } } } } },
    e0 => { const [l, a, b] = nb[e0.index]; pending.createurs = { nmin: a, nmax: b, label: L(`${l} recette(s)`, `${l} recipe(s)`) }; go(hr('createurs')); });

  const ib = [['0', 0, 0], [L('1 à 9', '1–9'), 1, 9], [L('10 à 24', '10–24'), 10, 24], [L('25 à 49', '25–49'), 25, 49], [L('50 à 99', '50–99'), 50, 99], [L('100 à 499', '100–499'), 100, 499], [L('500 et +', '500+'), 500, 1e9]];
  chart('aInst', { type: 'bar', data: { labels: ib.map(x => x[0]), datasets: [
    { label: L('Toutes les recettes', 'All recipes'), data: ib.map(([, a, b]) => R.filter(r => r.i >= a && r.i <= b).length), backgroundColor: ib.map(([, a]) => a >= 50 ? P[1] : P[0]), borderRadius: 5 },
    ...(myC ? [{ label: L('Les vôtres', 'Yours'), data: ib.map(([, a, b]) => myC.recipes.filter(r => r.i >= a && r.i <= b).length), backgroundColor: ink, borderRadius: 5 }] : [])] },
    options: { plugins: { legend: { display: !!myC, position: 'bottom' } }, scales: { x: noGrid, y: { type: 'logarithmic', ticks: { callback: v => [1, 10, 100, 1000].includes(v) ? v : '' } } } } },
    e0 => { const [l, a, b] = ib[e0.index]; pending.recettes = { imin: a, imax: b, label: l, u: e0.datasetIndex === 1 ? me : undefined }; go(hr('recettes')); });

  const months = new Map(), newC = new Map();
  R.forEach(r => { if (r.p) { const k = r.p.slice(0, 7); months.set(k, (months.get(k) || 0) + 1); } });
  C.forEach(c => { if (c.first) { const k = c.first.slice(0, 7); newC.set(k, (newC.get(k) || 0) + 1); } });
  const mk = [...months.keys()].sort().slice(-24);
  chart('aMonth', { type: 'bar', data: { labels: mk.map(k => monthLbl(k)), datasets: [
    { label: L('Recettes publiées', 'Recipes published'), data: mk.map(k => months.get(k)), backgroundColor: P[0], borderRadius: 4, order: 2 },
    { label: L('Nouveaux créateurs', 'New creators'), type: 'line', data: mk.map(k => newC.get(k) || 0), borderColor: P[2], backgroundColor: P[2], pointRadius: 2, borderWidth: 2, tension: .3, order: 1 }] },
    options: { interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, position: 'bottom' } }, scales: { x: { ...noGrid, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } }, y: { ticks: { precision: 0 } } } } },
    e0 => { pending.recettes = { month: mk[e0.index] }; go(hr('recettes')); });

  const agePts = R.filter(r => r.p).map(r => ({ x: ageDays(r.p), y: Math.max(.8, r.i), r }));
  chart('aAge', { type: 'scatter', data: { datasets: [
    { label: L('Recettes', 'Recipes'), data: agePts.filter(p => !isMe(p.r.u)), backgroundColor: alpha(P[0], .45), pointRadius: 3, pointHoverRadius: 6 },
    ...(myC ? [{ label: L('Les vôtres', 'Yours'), data: agePts.filter(p => isMe(p.r.u)), backgroundColor: ink, pointRadius: 6 }] : [])] },
    options: { plugins: { legend: { display: !!myC, position: 'bottom' }, tooltip: { callbacks: { label: x => L(`${x.raw.r.n} : ${nf(x.raw.r.i)} installations, ${Math.round(x.raw.x)} jours`, `${x.raw.r.n}: ${nf(x.raw.r.i)} installs, ${Math.round(x.raw.x)} days`) } } },
      scales: { x: { title: { display: true, text: L('Âge (jours)', 'Age (days)') } }, y: { type: 'logarithmic', title: { display: true, text: L('Installations', 'Installs') }, ticks: { callback: v => [1, 10, 100, 1000].includes(v) ? v : '' } } } } },
    (e0, ch) => openRecipe(ch.data.datasets[e0.datasetIndex].data[e0.index].r));

  const topCat = catList.slice(0, 12);
  chart('aCat', { type: 'bar', data: { labels: topCat.map(([k, o]) => `${catLabel(k)} (${o.n})`), datasets: [{ data: topCat.map(([, o]) => o.i), backgroundColor: topCat.map((_, k) => P[k % P.length]), borderRadius: 5 }] },
    options: { indexAxis: 'y', plugins: { tooltip: { callbacks: { label: x => `${nf(x.raw)} ${L('installations', 'installs')}` } } }, scales: { y: noGrid, x: { ticks: { maxTicksLimit: 5 } } } } },
    e0 => { pending.recettes = { cat: topCat[e0.index][0] }; go(hr('recettes')); });

  const grp = (name, f, color, r) => ({ label: name, data: C.filter(c => f(c) && !isMe(c.u)).map(c => ({ x: c.n, y: Math.max(1, c.s), u: c.u })), backgroundColor: color, pointRadius: r, pointHoverRadius: r + 3 });
  chart('aScatter', { type: 'scatter', data: { datasets: [
    grp('Top 10', c => c.r <= 10, P[0], 6), grp(L('11 à 50', '11–50'), c => c.r > 10 && c.r <= 50, P[3], 5), grp(L('51 à 100', '51–100'), c => c.r > 50 && c.r <= 100, P[1], 4),
    grp(L('Au-delà de 100', 'Beyond 100'), c => c.r > 100, alpha(P[2], .55), 3),
    ...(myC ? [{ label: L('Vous', 'You'), data: [{ x: myC.n, y: Math.max(1, myC.s), u: myC.u }], backgroundColor: ink, borderColor: P[0], borderWidth: 3, pointRadius: 9 }] : [])] },
    options: { plugins: { legend: { display: true, position: 'bottom' }, tooltip: { callbacks: { label: x => `${nameOf(x.raw.u)}${CO()}${plural(x.raw.x, 'recette', 'recipe')}, ${nf(x.raw.y)} pts` } } },
      scales: { x: { type: 'logarithmic', title: { display: true, text: L('Recettes', 'Recipes') }, ticks: { callback: v => [1, 2, 5, 10, 20, 50, 100].includes(v) ? v : '' } },
                y: { type: 'logarithmic', title: { display: true, text: 'Points' }, ticks: { callback: v => [1, 10, 100, 1000, 10000].includes(v) ? NF.format(v) : '' } } } } },
    (e0, ch) => go(hr('createur', ch.data.datasets[e0.datasetIndex].data[e0.index].u)));

  const [h, hh] = await Promise.all([loadHist('daily'), loadHist('hourly')]);
  const src = h && h.snaps.length >= 3 ? h : hh;
  const note = $('#aGrowthNote'); if (!note) return;
  if (!src || src.snaps.length < 2) { note.textContent = L('La courbe apparaîtra après quelques relevés.', 'The chart will appear after a few snapshots.'); return; }
  const daily = src === h, g = src.global;
  note.textContent = L(`${g.length} relevés ${daily ? 'quotidiens' : 'horaires'}. Entre le premier et le dernier : ${sg(g.at(-1).i - g[0].i)} installations, ${sg(g.at(-1).n - g[0].n)} recettes, ${sg(g.at(-1).c - g[0].c)} créateurs.`,
    `${g.length} ${daily ? 'daily' : 'hourly'} snapshots. From first to last: ${sg(g.at(-1).i - g[0].i)} installs, ${sg(g.at(-1).n - g[0].n)} recipes, ${sg(g.at(-1).c - g[0].c)} creators.`);
  chart('aGrowth', { type: 'line', data: { labels: g.map(x => new Date(x.t).toLocaleString(LOC, daily ? { day: 'numeric', month: 'short' } : { weekday: 'short', hour: '2-digit' })), datasets: [
    { label: L('Installations', 'Installs'), data: g.map(x => x.i), borderColor: P[0], backgroundColor: ctx => fade(ctx, P[0]), fill: true, pointRadius: 0, borderWidth: 2.5, tension: .25, yAxisID: 'y' },
    { label: L('Recettes publiées', 'Published recipes'), data: g.map(x => x.n), borderColor: P[2], backgroundColor: P[2], pointRadius: 0, borderWidth: 2, tension: .25, yAxisID: 'y2' }] },
    options: { interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, position: 'bottom' } },
      scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0 } }, y: { ticks: { callback: v => NF.format(v) } }, y2: { position: 'right', grid: { display: false }, ticks: { precision: 0 } } } } });
}

init();

// Installation en application (écran d'accueil) et mode hors-ligne
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
